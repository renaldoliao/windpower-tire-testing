<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Windpower Books: Pertanyaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap">
<style>
/* Same desk as the mockup: white slips on dispatch grey, one blue for actions. One question per slip, answered by tapping. */
:root{
  color-scheme:light;
  --paper:#eceef1;   /* canvas */
  --sheet:#ffffff;   /* question cards */
  --field:#f3f4f6;   /* chips and inputs */
  --ink:#15171b;     /* text */
  --muted:#656b74;   /* hints */
  --rule:#e3e6ea;    /* hairlines */
  --accent:#2457f5;  /* chosen answers, buttons */
  --accent-soft:#e6ecff;
  --guess:#7a5b00;   /* "from your sheet" notes */
  --guess-soft:#fff6db;
  --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1013;--sheet:#181b20;--field:#21252b;--ink:#eceef1;--muted:#9097a1;--rule:#272b32;--accent:#6b8dff;--accent-soft:#1d2645;--guess:#f0cf73;--guess-soft:#2e2712;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1013;--sheet:#181b20;--field:#21252b;--ink:#eceef1;--muted:#9097a1;--rule:#272b32;--accent:#6b8dff;--accent-soft:#1d2645;--guess:#f0cf73;--guess-soft:#2e2712;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding-block:12px 10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.logo{width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.logo::after{content:"";width:11px;height:11px;border-radius:50%;border:2px solid var(--sheet)}
.lang{display:flex;background:var(--sheet);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.progress{height:6px;background:var(--sheet);border-radius:999px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .45s cubic-bezier(.16,1,.3,1)}
.ptext{font-size:12px;color:var(--muted);margin-top:6px}
h1{font-size:clamp(34px,7vw,52px);font-weight:500;line-height:.95;letter-spacing:-0.03em;margin:22px 0 12px}
.lead{color:var(--muted);max-width:60ch;margin:0}
.part{margin-top:34px}
.part h2{font-size:22px;font-weight:500;letter-spacing:-0.015em;margin:0 0 4px}
.part .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.q{background:var(--sheet);border-radius:22px;padding:20px 20px 18px;margin-top:12px}
.send a{color:var(--accent)}
.q{scroll-margin-top:110px}
.q .num{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.q h3{font-size:18px;font-weight:500;letter-spacing:-0.01em;line-height:1.3;margin:6px 0 4px}
.q .why{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.guess{font-size:13.5px;background:var(--guess-soft);color:var(--guess);border-radius:12px;padding:8px 12px;margin:0 0 12px}
.sub-q{font-size:15px;font-weight:500;margin:14px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--rule);background:var(--field);border-radius:999px;padding:10px 15px;font-size:14.5px;line-height:1.25;min-height:44px;display:inline-flex;align-items:center}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.stack{border-radius:16px;width:100%}
input[type=text],textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid transparent;border-radius:12px;padding:11px 13px;margin-top:10px}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.done{font-size:12px;color:var(--accent);font-weight:500;margin-left:8px}
.checklist .opt{justify-content:space-between}
.send{background:var(--sheet);border-radius:22px;padding:22px;margin-top:34px}
.btn{all:unset;cursor:pointer;box-sizing:border-box;border-radius:999px;padding:13px 20px;font-weight:500;font-size:15px;text-align:center;border:1px solid var(--rule);background:var(--sheet);min-height:46px;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.small{font-size:13px;color:var(--muted)}
pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--field);border-radius:12px;padding:12px;max-height:260px;overflow:auto;margin-top:14px}
footer{padding-block:28px 40px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}
footer a{color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar"><div class="mark"><span class="logo" aria-hidden="true"></span><span id="t-brand"></span></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div></div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div><div class="ptext" id="ptext"></div>
</div></header>
<main class="wrap" id="main"></main>
<div class="wrap"><footer><span id="t-foot"></span><a href="index.html">Mockup</a><a href="index.html#privacy" id="t-priv"></a></footer></div>
<div id="toast" hidden></div>

   pick:[{k:'list',multi:true,opts:[{id:'Harian: yang harus ditagih',en:'Daily: what to collect'},{id:'Mingguan: penjualan dan stok',en:'Weekly: sales and stock'},{id:'Bulanan: laba rugi',en:'Monthly: profit and loss'},{id:'Bulanan: bagian per pemilik',en:'Monthly: each owner\'s share'},{id:'Untuk akuntan atau pajak',en:'For the accountant or tax'}]}]},
 ]},
 {id:'C',title:{id:'C. Cara input baru',en:'C. The new way of logging'},sub:{id:'Usulan kami supaya catatan rapi dan tidak ada pembayaran yang terlewat. Ci setuju?',en:'Our proposal so records stay tidy and no payment gets lost. Do you agree?'},habits:[
  {id:'h1',t:{id:'Setiap nota dimasukkan di hari yang sama, dengan nomor faktur yang sama, dan toko dipilih dari daftar.',en:'Every invoice is entered the same day, with the same number, picking the shop from the list.'}},
  {id:'h2',t:{id:'Siapa pun yang menerima uang (termasuk Bella dan JW) mencatatnya sendiri di HP: tunai, transfer, atau cek, dan nota mana yang dibayar.',en:'Whoever receives money (Bella and JW included) records it on their own phone: cash, transfer or cheque, and which invoices it pays.'}},
  {id:'h3',t:{id:'Setoran atau serah terima uang dicatat sebagai "Pindah uang", supaya jelas siapa memegang berapa.',en:'Handing over or depositing money is recorded as "Moved money", so it is always clear who holds what.'}},
  {id:'h4',t:{id:'Cek dan giro dicatat saat diterima: bank, nomor, dan tanggal cair.',en:'Cheques and giro are recorded when received: bank, number and clearing date.'}},
  {id:'h5',t:{id:'DO dicatat saat dibuka, lalu ditandai "Ban tiba" dengan hitungan gudang saat truk datang.',en:'A DO is recorded when opened, then marked "Tires arrived" with the warehouse count when the truck comes.'}},
  {id:'h6',t:{id:'Salah catat diperbaiki atau dibatalkan (void), bukan dihapus dan diketik ulang.',en:'Mistakes are fixed or voided, never deleted and retyped.'}},
  {id:'h7',t:{id:'Gudang dihitung sebulan sekali, selisihnya dicatat.',en:'The warehouse is counted once a month and any difference is recorded.'}},
  {id:'h8',t:{id:'Excel jadi hasil unduhan, bukan tempat mengetik. Ci tetap bisa unduh format yang sama kapan saja.',en:'The Excel becomes the download, not the place to type. You can still download the same layout any time.'}},
 ]},
 {id:'D',title:{id:'D. Data untuk hari pertama',en:'D. Data for day one'},sub:{id:'Disiapkan untuk tanggal mulai. Tandai kalau sudah siap.',en:'To prepare for the start date. Mark when ready.'},prep:[
  {id:'d1',t:{id:'Uang tunai yang dipegang tiap orang (Ci Via, Bella, JW)',en:'Cash each person holds (Ci Via, Bella, JW)'}},
  {id:'d2',t:{id:'Saldo tiap rekening bank',en:'Each bank account balance'}},
  {id:'d3',t:{id:'Hitungan stok per jenis ban (per lokasi kalau perlu)',en:'Stock count per tire type (per location if needed)'}},
  {id:'d4',t:{id:'Daftar nota yang belum lunas: nomor, toko, sisa, jatuh tempo',en:'Unpaid invoices: number, shop, amount left, due date'}},
  {id:'d5',t:{id:'Utang ke Jakarta: nomor DO/invoice, jumlah, jatuh tempo',en:'What is owed to Jakarta: DO/invoice number, amount, due date'}},
  {id:'d6',t:{id:'Daftar toko resmi: satu nama per toko, kota, nomor HP, tempo, harga',en:'Official shop list: one name per shop, town, phone, terms, price'}},
  {id:'d7',t:{id:'Cek/giro yang belum cair: bank, nomor, jumlah, tanggal cair',en:'Cheques not cleared yet: bank, number, amount, clearing date'}},
 ]},
];

const mainQs=PARTS.filter(p=>p.main).flatMap(p=>p.qs);
const answered=q=>q.pick.every(pk=>{const v=A[q.id+'.'+pk.k];return Array.isArray(v)?v.length:!!v;})||!!(A[q.id+'.note']||'').trim();
const optKey=o=>o.id;

function render(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
  $('#t-brand').textContent=t(UI.brand);$('#t-foot').textContent=t(UI.foot);$('#t-priv').textContent=t(UI.priv);
  document.title=t(UI.brand)+': '+t(UI.title);
  let h=`<h1>${esc(t(UI.title))}</h1><p class="lead">${esc(t(UI.lead))}</p>`;
  let n=0;
  for(const P of PARTS){
    h+=`<section class="part"><h2>${esc(t(P.title))}</h2><p class="sub">${esc(t(P.sub))}</p>`;
    if(P.qs)for(const q of P.qs){n++;
      h+=`<div class="q" id="q-${q.id}"><span class="num">${P.id}${P.qs.indexOf(q)+1}</span>${answered(q)?`<span class="done">✓</span>`:''}<h3>${esc(t(q.title))}</h3>${q.why?`<p class="why">${esc(t(q.why))}</p>`:''}${q.guess?`<p class="guess">${esc(t(UI.guess)+t(q.guess))}</p>`:''}`;
      for(const pk of q.pick){const key=q.id+'.'+pk.k,v=A[key];
        if(pk.label)h+=`<p class="sub-q">${esc(t(pk.label))}${pk.multi?` <span class="small">(${esc(t(UI.multi))})</span>`:''}</p>`;else if(pk.multi)h+=`<p class="small" style="margin:0 0 8px">${esc(t(UI.multi))}</p>`;
        h+=`<div class="opts" role="group">${pk.opts.map(o=>{const on=pk.multi?(v||[]).includes(optKey(o)):v===optKey(o);return `<button type="button" class="opt${pk.stack?' stack':''}" data-q="${key}" data-v="${esc(optKey(o))}" data-multi="${pk.multi?1:0}" aria-pressed="${on}">${esc(t(o))}</button>`;}).join('')}</div>`;}
      h+=`<input type="text" data-note="${q.id}.note" value="${esc(A[q.id+'.note']||'')}" placeholder="${esc(t(UI.other))}" aria-label="${esc(t(UI.other))}"></div>`;}
    if(P.habits)h+=P.habits.map((x,i)=>{const v=A['C.'+x.id];return `<div class="q"><span class="num">C${i+1}</span><h3 style="font-size:16px">${esc(t(x.t))}</h3><div class="opts">${[['agree',UI.agree],['discuss',UI.discuss]].map(([k,lab])=>`<button type="button" class="opt" data-q="C.${x.id}" data-v="${k}" data-multi="0" aria-pressed="${v===k}">${esc(t(lab))}</button>`).join('')}</div>${v==='discuss'?`<input type="text" data-note="C.${x.id}.note" value="${esc(A['C.'+x.id+'.note']||'')}" placeholder="${esc(t(UI.other))}">`:''}</div>`;}).join('');
    if(P.prep)h+=`<div class="q checklist">${P.prep.map(x=>{const v=A['D.'+x.id];return `<div style="padding-block:10px;border-bottom:1px solid var(--rule)"><p style="margin:0 0 8px;font-size:15px">${esc(t(x.t))}</p><div class="opts">${[['ready',UI.ready],['notyet',UI.notyet]].map(([k,lab])=>`<button type="button" class="opt" data-q="D.${x.id}" data-v="${k}" data-multi="0" aria-pressed="${v===k}">${esc(t(lab))}</button>`).join('')}</div></div>`;}).join('')}</div>`;
    h+=`</section>`;}
  const miss=mainQs.filter(q=>!answered(q));
  h+=`<section class="send"><h2 style="font-size:22px;font-weight:500;margin:0 0 6px">${esc(t(UI.sendT))}</h2><p class="small" style="margin:0">${esc(t(UI.sendL))}</p>
    ${miss.length?`<p class="small" style="margin-top:10px">${esc(t(UI.missing))}${miss.map(q=>`<a href="#q-${q.id}">A${mainQs.indexOf(q)+1}</a>`).join(', ')}</p>`:''}
    <div class="btns"><button class="btn primary" data-act="wa">${esc(t(UI.wa))}</button><button class="btn" data-act="copy">${esc(t(UI.copy))}</button><button class="btn" data-act="dl">${esc(t(UI.dl))}</button></div>
    <details style="margin-top:14px"><summary class="small" style="cursor:pointer">${esc(t(UI.preview))}</summary><pre id="sum">${esc(summary())}</pre></details>
    <div class="btns"><button class="btn" data-act="reset" id="resetBtn">${esc(t(UI.reset))}</button></div></section>`;
  $('#main').innerHTML=h;progress();
}
function progress(){const a=mainQs.filter(answered).length,b=mainQs.length;$('#bar').style.width=(a/b*100)+'%';$('#ptext').textContent=t(UI.progress).replace('{a}',a).replace('{b}',b);}

function label(qid,k,v){const P=PARTS.find(p=>p.qs&&p.qs.some(q=>q.id===qid));const q=P&&P.qs.find(x=>x.id===qid);const pk=q&&q.pick.find(x=>x.k===k);const o=pk&&pk.opts.find(x=>optKey(x)===v);return o?t(o):v;}
function summary(){
  const out=[t(UI.brand)+': '+t(UI.title),''];
  for(const P of PARTS){out.push('== '+t(P.title)+' ==');
    if(P.qs)P.qs.forEach((q,i)=>{const parts=[];for(const pk of q.pick){const v=A[q.id+'.'+pk.k];const vals=Array.isArray(v)?v.map(x=>label(q.id,pk.k,x)):v?[label(q.id,pk.k,v)]:[];parts.push((pk.label?t(pk.label)+' ':'')+(vals.length?vals.join(', '):'-'));}
      const note=(A[q.id+'.note']||'').trim();out.push(`${P.id}${i+1}. ${t(q.title)}`);parts.forEach(x=>out.push('   '+x));if(note)out.push('   '+t(UI.other)+': '+note);});
    if(P.habits)P.habits.forEach((x,i)=>{const v=A['C.'+x.id];const note=(A['C.'+x.id+'.note']||'').trim();out.push(`C${i+1}. ${v==='agree'?t(UI.agree):v==='discuss'?t(UI.discuss):'-'}${note?' ('+note+')':''}`);});
    if(P.prep)P.prep.forEach((x,i)=>{const v=A['D.'+x.id];out.push(`D${i+1}. ${t(x.t)}: ${v==='ready'?t(UI.ready):v==='notyet'?t(UI.notyet):'-'}`);});
    out.push('');}
  return out.join('\n');
}
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600);}

document.addEventListener('click',async ev=>{
  const lb=ev.target.closest('[data-lang]');if(lb){L=lb.dataset.lang;try{localStorage.setItem('wb-q-lang',L);}catch(_){}const y=scrollY;render();scrollTo(0,y);return;}
  const b=ev.target.closest('[data-q]');
  if(b){const key=b.dataset.q,v=b.dataset.v;
    if(b.dataset.multi==='1'){const arr=Array.isArray(A[key])?A[key].slice():[];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);A[key]=arr;}
    else A[key]=A[key]===v?'':v;
    save();const y=scrollY;render();scrollTo(0,y);return;}
  const a=ev.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,txt=summary();
  if(act==='wa'){location.href='https://wa.me/?text='+encodeURIComponent(txt);}
  else if(act==='copy'){try{await navigator.clipboard.writeText(txt);toast(t(UI.copied));}catch(_){const s=$('#sum');s.closest('details').open=true;const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}}
  else if(act==='dl'){const u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='jawaban-windpower-books.txt';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast(t(UI.saved));}
  else if(act==='reset'){if(a.dataset.sure!=='1'){a.dataset.sure='1';a.textContent=t(UI.resetSure);setTimeout(()=>{if(a.isConnected){a.dataset.sure='';a.textContent=t(UI.reset);}},4000);return;}A={};save();render();scrollTo(0,0);toast(t(UI.cleared));}
});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.note;if(!k)return;A[k]=ev.target.value;save();progress();const s=$('#sum');if(s)s.textContent=summary();});
document.addEventListener('change',ev=>{if(ev.target.dataset&&ev.target.dataset.note){const y=scrollY;render();scrollTo(0,y);}});
render();
})();
</script>
</body>
