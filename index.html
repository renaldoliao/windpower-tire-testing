<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Windpower Books (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap">
<style>
/* Concept: a dispatch desk. White delivery slips (cards) on a cool grey desk; tire codes and money in one clean sans.
   Layout: Overview leads with one large money card and a stacked KPI card beside it, then actions, to-do and a weekly sales chart. */
:root{
  color-scheme:light;
  --paper:#eceef1;      /* Dispatch Grey: page canvas */
  --sheet:#ffffff;      /* Slip White: cards only, lifted off the grey */
  --field:#f3f4f6;      /* Field: input and chip fill inside cards */
  --ink:#15171b;        /* Tire Black: text and all chart marks */
  --muted:#656b74;      /* Graphite: labels and secondary text */
  --rule:#e3e6ea;       /* Hairline: separators inside cards */
  --accent:#2457f5;     /* Dispatch Blue: buttons, links, active state, nothing else */
  --accent-deep:#1a44cc;
  --accent-soft:#e6ecff;
  --loss:#c0392b;       /* Late Red: late invoices and negative money only */
  --loss-soft:#fbe9e7;
  --carbon:var(--accent);
  --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
  --mono:var(--sans);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1013;--sheet:#181b20;--field:#21252b;--ink:#eceef1;--muted:#9097a1;--rule:#272b32;--accent:#6b8dff;--accent-deep:#5277f5;--accent-soft:#1d2645;--loss:#ef8476;--loss-soft:#3a1f1c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1013;--sheet:#181b20;--field:#21252b;--ink:#eceef1;--muted:#9097a1;--rule:#272b32;--accent:#6b8dff;--accent-deep:#5277f5;--accent-soft:#1d2645;--loss:#ef8476;--loss-soft:#3a1f1c;color-scheme:dark}

html,body{background:var(--paper);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.login{max-width:440px;display:grid;gap:18px}
body{color:var(--ink);font:400 15px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--carbon)}
:focus-visible{outline:1px solid var(--carbon);outline-offset:3px}

/* type scale: 112 / 64 / 28 / 15 / 13 / 11 */
.display{font-size:clamp(52px,12.5vw,112px);line-height:.86;letter-spacing:-0.045em;font-weight:400;margin:0;text-wrap:balance}
.h1{font-size:clamp(38px,7.5vw,64px);line-height:.95;letter-spacing:-0.03em;font-weight:400;margin:0;text-wrap:balance}
.h2{font-size:28px;line-height:1.1;letter-spacing:-0.015em;font-weight:400;margin:0}
.small{font-size:13px;letter-spacing:.01em;color:var(--muted)}
.micro{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:0;font-weight:500}
.size{font-family:var(--mono);letter-spacing:.06em;font-size:.95em}
.neg{color:var(--loss)}
p{margin:0}
.prose{max-width:62ch;display:grid;gap:12px}

/* header: wordmark, one row of text links */
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 28px;padding-block:22px 14px;border-bottom:1px solid var(--rule)}
.mark{color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;letter-spacing:-0.01em}
.mark .micro{margin-left:10px}
nav{display:flex;flex-wrap:wrap;gap:4px 20px}
nav a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.02em;padding-block:4px}
nav a[aria-current="page"]{color:var(--carbon);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.banner{border-bottom:1px solid var(--rule);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}

section{padding-block:40px}
.band{background:var(--sheet)}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

/* controls: pills for actions, ruled lines for inputs */
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--carbon);border-color:var(--carbon);color:var(--sheet)}
.btn:disabled{opacity:.5;cursor:default}
.link{color:var(--carbon);background:none;border:0;padding:0;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--loss)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--carbon);color:var(--carbon)}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--muted);border-radius:0;padding:7px 0;width:100%;min-width:0}
textarea{border:1px solid var(--rule);padding:10px;min-height:150px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);background-position:right 6px top 55%,right 1px top 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:18px}
select option{background:var(--sheet);color:var(--ink)}
input.num{text-align:right}
.fld{display:grid;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px 24px}
.tag{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5;white-space:nowrap}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.lines td{padding-block:6px;vertical-align:middle}
.lines td:first-child{min-width:200px}
.lines input{min-width:90px}

/* overview */
.hero{padding-block:48px 36px;display:grid;gap:18px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:15px}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 56px}
.lrow{display:flex;justify-content:space-between;gap:16px;padding-block:13px;border-bottom:1px solid var(--rule);align-items:baseline}
.lrow .v{font-size:20px;letter-spacing:-0.01em;white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:40px 56px}

/* record: form one side, invoice the other */
.recgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;align-items:start;margin-top:24px}
@media (max-width:900px){.recgrid{grid-template-columns:1fr}}
.nota{background:var(--sheet);padding:24px;display:grid;gap:10px;border-top:1px solid var(--ink)}
.nota .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.nota .big{font-size:clamp(30px,3.6vw,46px);line-height:.95;letter-spacing:-0.025em;white-space:nowrap}
.nota hr{border:0;border-top:1px dashed var(--rule);margin:6px 0;width:100%}
.hint{font-size:13px;color:var(--muted);max-width:70ch}
.err{color:var(--loss);font-size:14px;min-height:1.2em}
details summary{cursor:pointer;color:var(--carbon);font-size:13px;text-decoration:underline;text-underline-offset:3px;list-style:none}
details summary::-webkit-details-marker{display:none}
.quick{display:grid;gap:12px;padding-block:14px}

/* statements: centred printed sheet */
.statement{max-width:780px;margin:28px auto 0;background:var(--sheet);padding:44px clamp(18px,5vw,60px) 40px;display:grid;gap:22px}
.statement .head{text-align:center;display:grid;gap:10px;justify-items:center}
.srow{display:flex;justify-content:space-between;gap:16px;padding-block:9px;border-bottom:1px solid var(--rule);animation:rin .5s var(--ease) both}
.srow.ind{padding-left:20px}
.srow.headr{border-bottom:1px solid var(--ink);padding-top:20px}
.srow.headr span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:500}
.srow.total{font-weight:500}
.srow.grand{font-size:22px;letter-spacing:-0.01em;border-bottom:1px solid var(--ink);padding-block:14px}
.srow.note{color:var(--muted);font-size:13px;border:0}
@keyframes rin{from{opacity:.15;transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.srow{animation:none}}
.stamp{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.stamp.off{border-color:var(--loss);color:var(--loss)}

/* skeleton */
.skel{background:var(--sheet);display:block}
.skel.a{height:14px;width:180px;margin-bottom:22px}
.skel.b{height:96px;width:min(560px,90%);margin-bottom:28px}
.skel.c{height:44px;width:100%;margin-bottom:2px}

.empty{padding-block:28px;border-top:1px solid var(--rule);display:grid;gap:12px}
footer{border-top:1px solid var(--rule);margin-top:56px;padding-block:18px 28px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
strong{font-weight:500}
.thumb{display:block;object-fit:cover;background:var(--sheet);border:1px solid var(--rule);flex:none}
.thumb.ph{border-radius:50%;position:relative}
.thumb.ph::after{content:"";position:absolute;inset:28%;border:1px solid var(--rule);border-radius:50%}
.tire{display:flex;gap:14px;align-items:flex-start}
.ex{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.01em;line-height:1.4;margin-top:2px;font-weight:400}
.srow>span:first-child{min-width:0}
.srow>span:last-child{white-space:nowrap}
.summary{font-size:17px;line-height:1.5;letter-spacing:-0.005em;max-width:58ch;margin:0 auto;text-align:center;text-wrap:pretty}
.pricebar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end;padding-block:18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:22px}
input.price{width:130px;border-bottom-color:var(--carbon)}
.changed{display:block;color:var(--carbon);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 18px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

/* v3: wholesale flow, mobile entry */
.lineRow{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(var(--cols,2),minmax(70px,1fr)) minmax(90px,1fr) auto;gap:8px 14px;align-items:end;padding-block:8px;border-bottom:1px solid var(--rule)}
.lineRow .lt{text-align:right;font-size:13px;color:var(--muted);padding-bottom:9px;white-space:nowrap}
.lineRow .rm{padding-bottom:9px}
.lineHead{display:contents}
@media (max-width:640px){.lineRow{grid-template-columns:repeat(2,minmax(0,1fr))}.lineRow .lp{grid-column:1/-1}.lineRow .lt{text-align:left}}
.alloc{display:grid;gap:0;border-top:1px solid var(--ink)}
.alloc label{display:flex;gap:12px;align-items:center;padding-block:11px;border-bottom:1px solid var(--rule);cursor:pointer}
.alloc input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--carbon);border:0;padding:0}
.alloc .amt{margin-left:auto;white-space:nowrap}
.tag.late{color:var(--loss)}
.tag.ok{color:var(--muted)}
.notano{font-family:var(--mono);letter-spacing:.04em}
@media (max-width:640px){input,select,textarea{font-size:16px}}
@media (pointer:coarse){.btn{min-height:46px;padding-inline:22px}.seg button{min-height:42px;padding-inline:16px}.link{padding-block:8px}}

/* v4: simple journey */
nav a.newbtn{color:var(--sheet);padding:8px 16px;font-size:14px;text-decoration:none}
.moreLink{display:none;color:var(--muted);text-decoration:none;font-size:14px}
.moreLink[aria-current]{color:var(--carbon)}
.tabbar{display:none}
@media (max-width:760px){
  nav#nav{display:none}.moreLink{display:inline}
  header.top{flex-wrap:nowrap}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:4px;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
  .tabbar a{text-align:center;font-size:12px;letter-spacing:.01em;color:var(--muted);text-decoration:none;padding:10px 0}
  .tabbar a[aria-current]{color:var(--carbon)}
  .tabbar a.plus{background:var(--carbon);color:var(--sheet);border-radius:999px;font-size:13px;font-weight:500}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.btn.big{font-size:16px;padding:13px 26px}
.btn.sm{font-size:13px;padding:6px 14px;min-height:0;white-space:nowrap}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;align-content:start;padding:22px;min-height:118px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);color:var(--ink)}
.tile:hover{background:var(--sheet)}
.tile:focus-visible{outline:1px solid var(--carbon);outline-offset:-1px}
.tile .tt{font-size:22px;line-height:1.05;letter-spacing:-0.015em}
.tiles.main .tile{min-height:150px}
.tiles.main .tile .tt{font-size:clamp(26px,3vw,32px);letter-spacing:-0.02em}
.tile .td{font-size:13px;line-height:1.4;color:var(--muted);letter-spacing:.01em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));column-gap:40px}
.stat{display:grid;gap:8px;align-content:start;padding-block:18px;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
a.stat:hover .bign{color:var(--carbon)}
.stat .bign{font-size:clamp(32px,4.4vw,46px);line-height:.92;letter-spacing:-0.025em;white-space:nowrap}
.stat .small{line-height:1.45}
.txn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;padding-block:12px;border-bottom:1px solid var(--rule)}
.txn:hover .tk{color:var(--carbon)}
.txn:focus-visible{outline:1px solid var(--carbon);outline-offset:2px}
.txn .tk{font-size:15px;color:var(--ink)}
.txn .tdsc{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.txn .tamt{grid-column:2;grid-row:1/3;align-self:center;text-align:right;white-space:nowrap;color:var(--ink)}
.dayh{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:22px;padding-bottom:8px;border-bottom:1px solid var(--ink);margin:0}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px;align-items:center;padding-block:13px;border-bottom:1px solid var(--rule)}
.uamt{white-space:nowrap;font-size:17px}
@media (max-width:520px){.urow{grid-template-columns:minmax(0,1fr) auto}.urow .btn{grid-column:1/-1;justify-self:start}}
.stockrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(110px,.7fr) minmax(170px,1.2fr);gap:14px 28px;align-items:center;padding-block:18px;border-bottom:1px solid var(--rule)}
.stockrow .sq{display:grid;gap:4px}
.stockrow .sq .bign{font-size:34px;line-height:.95;letter-spacing:-0.02em}
@media (max-width:640px){.stockrow{grid-template-columns:1fr 1fr}.stockrow .tire{grid-column:1/-1}}
input[type=search]{-webkit-appearance:none;appearance:none}

/* v5: product-dashboard look. White cards on a cool dispatch-grey desk, one blue for actions, charts in ink. */
body{font:400 15px/1.45 var(--sans);letter-spacing:-0.005em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px}
.display{font-size:clamp(46px,8vw,88px);font-weight:500;line-height:.92;letter-spacing:-0.04em}
.h1{font-size:clamp(30px,4.6vw,44px);font-weight:500;line-height:1;letter-spacing:-0.025em}
.h2,.ch{font-size:17px;font-weight:500;letter-spacing:-0.01em;line-height:1.3;margin:0}
.micro{font-size:11px;letter-spacing:.1em;font-weight:500}
.size,.notano{font-family:var(--sans);letter-spacing:0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.small{font-size:13px}

/* shell */
header.top{align-items:center;border-bottom:0;padding-block:18px 10px}
.mark{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.mark .logo{width:28px;height:28px;border-radius:50%;background:var(--ink);display:inline-grid;place-items:center;flex:none}
.mark .logo::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--sheet)}
.mark .micro{display:none}
nav#nav{background:var(--sheet);border-radius:999px;padding:5px;gap:2px;align-items:center;flex-wrap:nowrap}
nav#nav a{padding:8px 15px;border-radius:999px;font-size:14px;letter-spacing:0;color:var(--muted)}
nav#nav a[aria-current="page"]{background:var(--paper);color:var(--ink);text-decoration:none}
nav#nav a.newbtn{background:var(--accent);color:#fff;margin-left:6px}
.banner{border:0;justify-content:center;padding-block:4px 6px;font-size:12px;gap:4px 12px}
.banner .small{font-size:12px}
.band{background:transparent}
section{padding-block:22px}
footer{border-top:0;margin-top:40px}

/* surfaces */
.card{background:var(--sheet);border-radius:22px;padding:22px 24px}
.card.list{padding-block:4px}
.card .lrow:last-child,.card .txn:last-child,.card .urow:last-child,.card .stockrow:last-child{border-bottom:0}
.lrow,.txn,.urow,.stockrow{border-bottom-color:var(--rule)}

/* controls */
.btn{border:1px solid var(--rule);background:var(--sheet);font-weight:500;padding:10px 18px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.link{color:var(--accent);text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
.link.danger{color:var(--loss)}
details summary{color:var(--accent);text-decoration:none;font-weight:500}
.seg{gap:6px}
.seg button{background:var(--sheet);border-color:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
input,select,textarea{background:var(--field);border:1px solid transparent;border-radius:12px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
select{background-position:right 14px top 55%,right 9px top 55%;padding-right:30px}
input.price{width:150px;border-color:transparent}
.fld .micro{letter-spacing:.06em;text-transform:none;font-size:12.5px;color:var(--muted);font-weight:500}
.tag{border:0;background:var(--field);color:var(--muted);padding:3px 9px;font-size:10.5px;letter-spacing:.06em;font-weight:500}
.tag.late{background:var(--loss-soft);color:var(--loss)}
.alloc{border-top:0}
.changed{color:var(--accent)}
.hint{color:var(--muted)}

/* home */
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 24px}
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:22px}
.hgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:860px){.hgrid,.hgrid2{grid-template-columns:1fr}}
.hero{display:grid;gap:18px;align-content:start;padding:28px}
.hero-n{font-size:clamp(44px,6.6vw,80px);font-weight:500;line-height:.92;letter-spacing:-0.04em;white-space:nowrap}
.hero-n .cur{font-size:.36em;letter-spacing:0;color:var(--muted);margin-right:.25em;vertical-align:.95em}
.splitbar{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:3px}

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* numbers: accepts Indonesian style 1.250.000 or 1250000, minus allowed */
const n=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').trim();if(!s)return 0;s=s.replace(/rp/ig,'').replace(/\s/g,'');const neg=/^-/.test(s);s=s.replace(/[^0-9.,]/g,'').replace(/\./g,'').replace(',','.');const x=parseFloat(s);return isFinite(x)?(neg?-x:x):0;};
const fmt=x=>Math.round(x||0).toLocaleString('id-ID');
const rp=x=>{const v=Math.round(x||0);return (v<0?'-':'')+'Rp '+Math.abs(v).toLocaleString('id-ID');};
const M=x=>`<span class="${Math.round(x||0)<0?'neg':''}">${rp(x)}</span>`;
const pad=x=>String(x).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const addDaysTo=(s,k)=>{const d=parseD(s);d.setDate(d.getDate()+k);return iso(d);};
const addDays=k=>addDaysTo(today(),k);
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const nice=s=>s?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const short=s=>s?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const monthRange=off=>{const d=new Date();return [iso(new Date(d.getFullYear(),d.getMonth()+off,1)),iso(new Date(d.getFullYear(),d.getMonth()+off+1,0))];};
const monthLabel=s=>parseD(s).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const FAR='9999-12-31', START='0000-01-01';
const lsGet=k=>{try{return localStorage.getItem(k);}catch(_){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}};

const ORDER=['sale','recv','purchase','expense','pay','transfer','adjust','capital','draw','opening'];
const MAIN=['sale','recv','purchase','expense'];
const TYPES={sale:'Sold tires',recv:'Shop paid',purchase:'Tires arrived',expense:'Paid a cost',pay:'Paid Jakarta',transfer:'Moved money',adjust:'Counted the warehouse',capital:'Owner put money in',draw:'Owner took money out',opening:'Starting balances'};
const HINTS={
  sale:'Copy one paper invoice. If the shop pays later, pick how many days they have. The book keeps the invoice open until it is fully paid. A returned tire: enter it with a minus quantity.',
  recv:'A shop paying for a invoice. Always pick who received the money, so nothing gets lost. Tick the invoices this pays for.',
  purchase:'Tires arriving from Jakarta. Type what the DO says and what the warehouse counted. The stock goes up by the counted number.',
  pay:'Paying Jakarta (or another supplier) for goods received earlier. Tick the DOs this pays for.',
  expense:'Running costs: rent, wages, electricity, fuel, shipping not linked to a invoice. Tire purchases go under Goods received, not here.',
  transfer:'Money changing hands inside the business. For example Ci Bella handing collected money to Ci Via, or cash deposited into the bank. Profit does not change.',
  adjust:'After counting the warehouse, enter only the difference. Missing or damaged tires: a minus number. Extra tires found: a plus number.',
  capital:'The owner\'s own money put into the business.',
  draw:'Money the owner takes out for personal use. This is not a business cost, so it does not lower profit.',
  opening:'Do this once, on your start date. Write down what the business has on day one: money each person holds, the bank, tires in the warehouse, unpaid invoices, and what you owe Jakarta.'
};
const SHIP='Shipping';
const DEF_CATS=[SHIP,'Salaries and wages','Rent','Electricity and water','Transport and fuel','Loading and unloading','Phone and internet','Repairs and upkeep','Taxes and permits','Bank fees','Other'];
const DEF_ACCTS=[{id:'cash',name:'Cash (Ci Via)'},{id:'bella',name:'Cash (Ci Bella)'},{id:'bank',name:'Bank'}];
const TERMS=[['cash','Paid in full now'],['7','7 days'],['14','14 days'],['30','30 days'],['date','Pick a date']];

const S={mode:'loading',db:null,user:null,uid:null,canWrite:true,demo:false,slow:false,err:'',ready:{p:0,c:0,d:0,m:0},
  live:{products:{},contacts:{},days:{},setup:{}},ver:0,cache:{},draft:null,editing:null,formMounted:false,lastRoute:'',allocKey:null,
  rp:{preset:'this',from:'',to:'',tab:'pl'},jr:{month:today().slice(0,7),type:'',g:'all',q:''},viewId:null,saved:null,prodEdit:null,contEdit:null,delArm:null,
  priceEdits:{},explain:false,assets:null,photoFor:null,sb:null,me:null,authView:'signin',authMsg:''};
S.live.entries=[];S.live.members=[];

/* ---------- example data, only shown in example mode, never saved ---------- */
let _demo=null;
function DEMO(){
  if(_demo)return _demo;
  const products={p1:{brand:'Windpower',size:'7.50-16',pattern:'WGC29',cat:'Truck',price:2050000,low:15},p2:{brand:'Windpower',size:'7.50-16',pattern:'WSR81',cat:'Truck',price:2050000,low:15}};
  const contacts={c1:{name:'Windpower Jakarta (example)',kind:'supplier',phone:''},c2:{name:'Toko Sumber Ban (example)',kind:'customer',phone:''},c3:{name:'Toko Maju Jaya (example)',kind:'customer',phone:''},c4:{name:'UD Lancar Lahat (example)',kind:'customer',phone:''}};
  let i=0;const E=(off,o)=>Object.assign({id:'x'+(++i),d:addDays(off),ts:i,note:''},o);
  const entries=[
    E(-45,{t:'opening',bal:{cash:15000000,bella:0,bank:120000000},lines:[{p:'p1',q:30,c:1760000},{p:'p2',q:20,c:1790000}],recv:[{k:'c3',a:12300000,nota:'00640',due:addDays(-6)}],pay:[{k:'c1',a:35000000,nota:'DO-2291',due:addDays(-15)}]}),
    E(-40,{t:'purchase',k:'c1',nota:'DO-2307',lines:[{p:'p1',qd:40,q:40,c:1765000},{p:'p2',qd:30,q:29,c:1795000}],extra:1500000,paid:0,acct:'bank',term:'30',due:addDays(-10),note:'One WSR81 short, claimed to Jakarta'}),
    E(-38,{t:'sale',k:'c2',nota:'00651',lines:[{p:'p1',q:10,u:2050000}],disc:0,ship:0,term:'14',due:addDays(-24),paid:0,acct:'cash'}),
    E(-30,{t:'pay',k:'c1',a:35000000,acct:'bank',alloc:[]}),
    E(-28,{t:'recv',k:'c2',a:20500000,acct:'bella',alloc:[]}),
    E(-25,{t:'expense',cat:'Rent',a:3500000,acct:'bank'}),
    E(-20,{t:'sale',k:'c3',nota:'00654',lines:[{p:'p2',q:8,u:2050000}],disc:0,ship:0,term:'cash',paid:16400000,acct:'cash'}),
    E(-15,{t:'sale',k:'c4',nota:'00655',lines:[{p:'p1',q:12,u:2050000},{p:'p2',q:6,u:2050000}],disc:0,ship:450000,shipAcct:'cash',term:'30',due:addDays(15),paid:5000000,acct:'bank'}),
    E(-12,{t:'transfer',from:'bella',to:'bank',a:20500000}),
    E(-10,{t:'sale',k:'c2',nota:'00656',lines:[{p:'p1',q:6,u:2050000}],disc:0,ship:0,term:'7',due:addDays(-3),paid:0,acct:'cash'}),
    E(-8,{t:'expense',cat:'Salaries and wages',a:6000000,acct:'cash'}),
    E(-5,{t:'sale',k:'c3',nota:'00657',lines:[{p:'p2',q:15,u:2050000},{p:'p1',q:10,u:2050000}],disc:0,ship:0,term:'30',due:addDays(25),paid:0,acct:'cash'}),
    E(-3,{t:'recv',k:'c3',a:12300000,acct:'bella',alloc:[]}),
    E(-2,{t:'adjust',lines:[{p:'p2',q:-1}],note:'One tire damaged in the warehouse'}),
    E(-1,{t:'draw',a:3000000,acct:'cash'}),
    E(-1,{t:'purchase',k:'c1',nota:'DO-2318',lines:[{p:'p1',qd:30,q:30,c:1770000}],extra:0,paid:0,acct:'bank',term:'30',due:addDays(29)})
  ];
  _demo={products,contacts,setup:{name:'Example Windpower Distributor'},entries};return _demo;
}
function liveEntries(){
  const k='le'+S.ver;if(S.cache[k])return S.cache[k];
  const out=S.live.entries.filter(v=>v&&v.t);
  const pri=t=>t==='opening'?0:t==='purchase'?1:2;
  out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(pri(a.t)-pri(b.t))||((a.ts||0)-(b.ts||0)));
  return S.cache[k]=out;
}
function D(){return S.demo?DEMO():{products:S.live.products,contacts:S.live.contacts,setup:S.live.setup,entries:liveEntries()};}
const cats=()=>{const c=D().setup.cats;return Array.isArray(c)&&c.length?c:DEF_CATS;};
const accts=()=>{const a=D().setup.accts;return Array.isArray(a)&&a.length?a:DEF_ACCTS;};
const aname=id=>{const a=accts().find(x=>x.id===id);return a?a.name:(id==='cash'?'Cash':id==='bank'?'Bank':id||'Cash');};
const pname=id=>{const p=D().products[id];return p?`${p.brand} ${p.size}${p.pattern?' '+p.pattern:''}`:'Removed tire';};
const pH=id=>{const p=D().products[id];return p?`<span class="size">${esc(p.size)}</span> ${esc(p.pattern||'')} <span class="small">${esc(p.brand)}</span>`:'Removed tire';};
const cname=id=>{const c=D().contacts[id];return c?c.name:(id?'Unknown':'No name');};
const cidByName=name=>{name=(name||'').trim().toLowerCase();if(!name)return '';const C=D().contacts;return Object.keys(C).find(k=>(C[k].name||'').trim().toLowerCase()===name)||'';};
const thumb=(id,sz)=>{const p=D().products[id];if(p&&p.img)return `<img class="thumb" src="${esc(photoUrl(p.img))}" alt="${esc(pname(id))}" width="${sz}" height="${sz}" loading="lazy" onerror="this.style.visibility='hidden'">`;return `<span class="thumb ph" style="width:${sz}px;height:${sz}px" aria-hidden="true"></span>`;};
const margin=(price,avg)=>avg?`Costs about ${rp(avg)}. You make ${M(price-avg)} per tire.`:'';

/* ---------- the accounting engine: replays every entry in date order ---------- */
function compute(from,to,ex){
  const key=[S.demo,S.ver,from,to,ex||''].join('|');if(S.cache[key])return S.cache[key];
  const st={},bal={},inv={ar:{},ap:{}},credit={ar:{},ap:{}},byId={};
  let eqOpen=0,cap=0,draw=0,profit=0,open=null;
  const P={goods:0,disc:0,cogs:0,trueUp:0,exp:{},adj:0,sales:0,tires:0};
  const C={openIn:0,saleCash:0,arIn:0,capIn:0,buyCash:0,apOut:0,expOut:0,drawOut:0};
  const recvBy={},warn=[];
  const sk=p=>st[p]||(st[p]={q:0,v:0,last:0});
  const mv=(a,x)=>{a=a||'cash';bal[a]=(bal[a]||0)+x;};
  const avg=s=>s.q>0?s.v/s.q:s.last;
  const settle=s=>{if(s.q>0)s.last=s.v/s.q;};
  /* cost of q units leaving the warehouse at moving average; the last units take exactly what is left, so nothing is lost to rounding */
  const takeOut=(s,q)=>{let c;if(q<=0)c=Math.round(q*avg(s));else if(s.q>0&&q>=s.q)c=s.v+Math.round((q-s.q)*s.last);else c=Math.round(q*avg(s));s.q-=q;s.v-=c;settle(s);return c;};
  /* units arriving at a known cost; if the book was below zero, the shortfall was costed at the old price, so the difference goes to COGS now */
  const putIn=(s,q,v)=>{let varc=0;if(s.q<0&&q>0){const cover=Math.min(-s.q,q),oldUnit=s.v/s.q,newUnit=v/q;varc=Math.round(cover*(newUnit-oldUnit));}s.q+=q;s.v+=v-varc;settle(s);return varc;};
  const addInv=(side,k,o)=>{const c=credit[side][k]||0;if(c>0){const t=Math.min(c,o.open);o.open-=t;credit[side][k]=c-t;}o.k=k;o.side=side;(inv[side][k]||(inv[side][k]=[])).push(o);byId[o.id]=o;};
  const payInv=(side,k,amt,alloc)=>{const L=inv[side][k]||[];let left=amt;
    for(const id of alloc||[]){const o=L.find(x=>x.id===id);if(o&&left>0&&o.open>0){const t=Math.min(o.open,left);o.open-=t;left-=t;}}
    for(const o of L.filter(x=>x.open>0.5).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0)){if(left<=0)break;const t=Math.min(o.open,left);o.open-=t;left-=t;}
    if(left>0.5)credit[side][k]=(credit[side][k]||0)+left;};
  const owe=(side,e,tot,paid)=>{const o=tot-paid;if(o>0.5)addInv(side,e.k,{id:e.id,nota:e.nota||'',d:e.d,due:e.due||e.d,total:tot,open:o});else if(o<-0.5)credit[side][e.k]=(credit[side][e.k]||0)-o;};
  for(const e of D().entries){
    if(e.d>to)break;
    if(ex&&e.id===ex)continue;
    const inP=e.d>=from;
    if(inP&&!open)open={tot:Object.values(bal).reduce((a,b)=>a+b,0)};
    switch(e.t){
      case 'opening':{let tot=0;const b=Object.assign({},e.bal||{});if(e.cash)b.cash=(b.cash||0)+n(e.cash);if(e.bank)b.bank=(b.bank||0)+n(e.bank);
        for(const [a,v] of Object.entries(b)){mv(a,n(v));tot+=n(v);if(inP)C.openIn+=n(v);}
        (e.lines||[]).forEach(l=>{const v=Math.round(n(l.q)*n(l.c));const vc=putIn(sk(l.p),n(l.q),v);tot+=v-vc;});
        (e.recv||[]).forEach((r,i)=>{if(!n(r.a))return;addInv('ar',r.k,{id:e.id+'-r'+i,nota:r.nota||'',d:e.d,due:r.due||e.d,total:n(r.a),open:n(r.a)});tot+=n(r.a);});
        (e.pay||[]).forEach((r,i)=>{if(!n(r.a))return;addInv('ap',r.k,{id:e.id+'-p'+i,nota:r.nota||'',d:e.d,due:r.due||e.d,total:n(r.a),open:n(r.a)});tot-=n(r.a);});
        eqOpen+=tot;break;}
      case 'purchase':{const L=e.lines||[];const sub=L.reduce((a,l)=>a+Math.round(n(l.q)*n(l.c)),0),extra=n(e.extra);
        let given=0;L.forEach((l,i)=>{const base=Math.round(n(l.q)*n(l.c)),share=i===L.length-1?extra-given:(sub?Math.round(extra*n(l.q)*n(l.c)/sub):0);given+=share;
          const vc=putIn(sk(l.p),n(l.q),base+share);if(vc){profit-=vc;if(inP){P.cogs+=vc;P.trueUp+=vc;}}});
        const tot=sub+extra,paid=n(e.paid);mv(e.acct,-paid);owe('ap',e,tot,paid);if(inP)C.buyCash+=paid;break;}
      case 'sale':{let goods=0,cogs=0,q=0;(e.lines||[]).forEach(l=>{const s=sk(l.p),lq=n(l.q),c=takeOut(s,lq);goods+=Math.round(lq*n(l.u));q+=lq;cogs+=c;if(s.q<0)warn.push({d:e.d,p:l.p,q:s.q});});
        const tot=goods-n(e.disc),paid=n(e.paid),ship=n(e.ship);mv(e.acct,paid);owe('ar',e,tot,paid);
        if(ship){mv(e.shipAcct||e.acct,-ship);}
        profit+=tot-cogs-ship;
        if(inP){P.goods+=goods;P.disc+=n(e.disc);P.cogs+=cogs;P.sales++;P.tires+=q;C.saleCash+=paid;if(paid)recvBy[e.acct||'cash']=(recvBy[e.acct||'cash']||0)+paid;if(ship){P.exp[SHIP]=(P.exp[SHIP]||0)+ship;C.expOut+=ship;}}break;}
      case 'recv':{const a=n(e.a);mv(e.acct,a);payInv('ar',e.k,a,e.alloc);if(inP){C.arIn+=a;recvBy[e.acct||'cash']=(recvBy[e.acct||'cash']||0)+a;}break;}
      case 'pay':{const a=n(e.a);mv(e.acct,-a);payInv('ap',e.k,a,e.alloc);if(inP)C.apOut+=a;break;}
      case 'expense':{const a=n(e.a);mv(e.acct,-a);profit-=a;if(inP){P.exp[e.cat||'Other']=(P.exp[e.cat||'Other']||0)+a;C.expOut+=a;}break;}
      case 'adjust':{let tot=0;(e.lines||[]).forEach(l=>{const s=sk(l.p),q=n(l.q);if(q<0)tot-=takeOut(s,-q);else if(q>0){const v=Math.round(q*avg(s));putIn(s,q,v);tot+=v;}});profit+=tot;if(inP)P.adj+=tot;break;}
      case 'capital':{const a=n(e.a);mv(e.acct,a);cap+=a;if(inP)C.capIn+=a;break;}
      case 'draw':{const a=n(e.a);mv(e.acct,-a);draw+=a;if(inP)C.drawOut+=a;break;}
      case 'transfer':{const a=n(e.a),fr=e.from||'cash',tt=e.to||(fr==='bank'?'cash':'bank');mv(fr,-a);mv(tt,a);break;}
    }
  }
  const money=Object.values(bal).reduce((a,b)=>a+b,0);
  if(!open)open={tot:money};
  const expTot=Object.values(P.exp).reduce((a,b)=>a+b,0);
  P.net=P.goods-P.disc;P.gross=P.net-P.cogs;P.expTot=expTot;P.profit=P.gross-expTot+P.adj;

function updateNota(){
  const d=S.draft,t=d.t,T=totals(d),c=now();const nota=$('#nota');if(!nota)return;
  d.lines.forEach((l,i)=>{const el=$('#lt-'+i);if(!el)return;if(t==='adjust'){el.textContent=l.p?'On record: '+(c.st[l.p]?c.st[l.p].q:0):'';}else el.textContent=n(l.q)&&n(l.x)?fmt(n(l.q)*n(l.x)):'';});
  if(t==='recv'||t==='pay')drawAlloc();
  const ln=(a,b,cls)=>`<div class="ln ${cls||''}"><span>${a}</span><span>${b}</span></div>`;
  let h=`<div class="ln"><span class="micro">${t==='sale'?'Invoice':t==='purchase'?'Goods received':TYPES[t]}</span><span class="small">${nice(d.d)}</span></div>`;
  if((t==='sale'||t==='purchase')&&(d.nota||d.k))h+=`<div class="ln"><span><span class="notano">${esc(d.nota)}</span></span><span>${esc(d.k)}</span></div>`;
  h+='<hr>';
  const valid=d.lines.filter(l=>l.p&&(n(l.q)||n(l.qd)));
  if(t==='sale'||t==='purchase'||t==='opening'){
    h+=valid.map(l=>ln(`${n(l.q)} × ${pH(l.p)}`,fmt(n(l.q)*n(l.x)))).join('')||'<p class="small">No tires added yet.</p>';
    if(t==='purchase'){const miss=valid.filter(l=>l.qd!==''&&n(l.qd)!==n(l.q));if(miss.length)h+=`<p class="small neg">${miss.map(l=>`${pH(l.p)}: DO says ${n(l.qd)}, counted ${n(l.q)} (${n(l.q)-n(l.qd)>0?'+':''}${n(l.q)-n(l.qd)}).`).join(' ')} The amount owed is based on what was counted. Write the claim to Jakarta in the note.</p>`;
      else if(valid.length&&valid.every(l=>l.qd!==''))h+='<p class="small">Count matches the DO.</p>';}
    if(t==='sale'&&n(d.disc))h+=ln('Discount','-'+fmt(n(d.disc)));
    if(t==='purchase'&&n(d.extra))h+=ln('Truck or delivery','+'+fmt(n(d.extra)));
    if(t==='opening'){const r=d.recv.reduce((a,x)=>a+n(x.a),0),p=d.pay.reduce((a,x)=>a+n(x.a),0);accts().forEach(a=>{if(n(d.bal[a.id]))h+=ln(esc(a.name),fmt(n(d.bal[a.id])));});if(r)h+=ln('Unpaid invoices',fmt(r));if(p)h+=ln('You owe','-'+fmt(p));
      h+=`<hr><span class="micro">Starting value of the business</span><div class="big">${M(T.total+r-p)}</div>`;nota.innerHTML=h;return;}
    h+=`<hr><span class="micro">${t==='sale'?'Jumlah (total)':'Total owed for this DO'}</span><div class="big">${M(T.total)}</div>`;
    const rest=T.total-T.paid,due=dueOf(d);
    if(d.term==='cash')h+=ln(`Paid now, ${esc(aname(d.acct))}`,fmt(T.paid));
    else{if(T.paid)h+=ln(`Paid now, ${esc(aname(d.acct))}`,fmt(T.paid));h+=ln(t==='sale'?'Still to collect':'Still to pay',`<span class="${rest<0?'neg':''}">${fmt(rest)}</span>`);h+=ln('Due',due?nice(due):'<span class="neg">Pick a date</span>');}
    if(t==='sale'&&valid.length){
      let cost=0;const w=[];valid.forEach(l=>{const s=c.st[l.p]||{q:0,v:0,last:0};const a=s.q>0?s.v/s.q:s.last;cost+=n(l.q)*a;if(n(l.q)>s.q&&!S.editing)w.push(`Only ${s.q} of ${pH(l.p)} on record.`);});
      h+='<hr>'+ln('What these tires cost you',fmt(cost));if(n(d.ship))h+=ln('Shipping',`-${fmt(n(d.ship))}`);h+=ln('You make on this invoice',M(T.total-cost-n(d.ship)));
      if(w.length)h+=`<p class="small neg">${w.join(' ')} Record the goods received first, or the profit will look too high.</p>`;
    }
  }else if(t==='adjust'){
    h+=valid.map(l=>{const s=c.st[l.p]||{q:0,v:0,last:0};const a=s.q>0?s.v/s.q:s.last;return ln(`${n(l.q)>0?'+':''}${n(l.q)} × ${pH(l.p)}`,M(n(l.q)*a));}).join('')||'<p class="small">Add the tires whose count is different.</p>';
    const tot=valid.reduce((a,l)=>{const s=c.st[l.p]||{q:0,v:0,last:0};return a+n(l.q)*(s.q>0?s.v/s.q:s.last);},0);
    h+=`<hr><span class="micro">Effect on profit</span><div class="big">${M(tot)}</div>`;
  }else if(t==='recv'||t==='pay'){
    h+=`<div class="big">${M(T.total)}</div>`+ln(t==='recv'?'Received by':'Paid from',esc(aname(d.acct)));
    const k=cidByName(d.k);if(k){const side=t==='recv'?'ar':'ap';const list=openFor(side,k);const sim=simulate(list,T.total,d.alloc);
      const used=sim.L.filter(x=>x.take>0);if(used.length)h+='<hr>'+used.map(x=>ln(`<span class="notano">${esc(x.o.nota||'No number')}</span>`,x.left<0.5?'Fully paid':`${fmt(x.take)} paid, ${fmt(x.left)} left`)).join('');
      if(sim.left>0.5)h+=`<p class="small">${fmt(sim.left)} more than what is owed. Kept as credit for the next ${side==='ar'?'invoice':'DO'}.</p>`;
      const tot=list.reduce((a,o)=>a+o.open,0);h+='<hr>'+ln(t==='recv'?'They owed before':'You owed before',fmt(tot))+ln('Left after this',M(Math.max(0,tot-T.total)));}
  }else{
    h+=`<div class="big">${M(T.total)}</div>`;
    if(t==='transfer')h+=`<p class="small">${esc(aname(d.from))} goes down, ${esc(aname(d.to))} goes up. Profit does not change.</p>`;
    if(t==='expense')h+=ln('Paid from',esc(aname(d.acct)));
    if(t==='draw')h+='<p class="small">Lowers money, not profit.</p>';
    if(t==='capital')h+='<p class="small">Raises money, not profit.</p>';
  }
  const out={expense:[d.acct,T.total],pay:[d.acct,T.total],draw:[d.acct,T.total],transfer:[d.from,T.total],purchase:[d.acct,T.paid],sale:[d.shipAcct||d.acct,n(d.ship)]}[t];
  if(out&&out[1]>0){const base=S.editing?compute(START,FAR,S.editing.id):c,have=base.bal[out[0]]||0;if(have-out[1]<-0.5)h+=`<p class="small neg">${esc(aname(out[0]))} only has ${rp(have)} on record. Check who paid, or record Moved money first.</p>`;}
  if(t==='sale'){const k=cidByName(d.k),base=S.editing?compute(START,FAR,S.editing.id):c,cr=k?(base.credit.ar[k]||0):0;if(cr>0.5)h+=`<p class="small">${esc(d.k)} has ${rp(cr)} credit from an earlier overpayment. It will be used on this invoice.</p>`;}
  nota.innerHTML=h;
}
function mountForm(){
  drawForm();S.formMounted=true;const a=$('#formArea');
  a.addEventListener('input',ev=>{const el=ev.target,d=S.draft;
    if(el.dataset.f){d[el.dataset.f]=el.value;if(el.dataset.f==='k')d.alloc=[];}
    else if(el.dataset.lf){d.lines[+el.dataset.li][el.dataset.lf]=el.value;}
    else if(el.dataset.rf){d[el.dataset.rl][+el.dataset.ri][el.dataset.rf]=el.value;}
    else if(el.dataset.bal){d.bal[el.dataset.bal]=el.value;}
    else return;
    updateNota();});
  a.addEventListener('change',ev=>{const el=ev.target,d=S.draft;
    if(el.dataset.alloc){const id=el.dataset.alloc;d.alloc=d.alloc.filter(x=>x!==id);if(el.checked)d.alloc.push(id);
      const k=cidByName(d.k),list=openFor(d.t==='recv'?'ar':'ap',k);const sum=list.filter(o=>d.alloc.includes(o.id)).reduce((s,o)=>s+o.open,0);
      if(d.alloc.length){d.a=fmt(sum);const ai=$('#f-a');if(ai)ai.value=d.a;}updateNota();return;}
    if(el.dataset.lf==='p'&&d.t==='sale'){const l=d.lines[+el.dataset.li];const p=D().products[l.p];if(p&&!n(l.x)&&n(p.price)){l.x=fmt(p.price);const x=$('#l-'+el.dataset.li+'-x');if(x)x.value=l.x;}updateNota();}
    if(el.dataset.f==='ship'){drawForm();return;}
    if(el.dataset.f==='acct'){lsSet('tsb-acct',el.value);}
    if(el.dataset.f)updateNota();});
  a.addEventListener('focusout',ev=>{const el=ev.target;if(el.hasAttribute&&el.hasAttribute('data-money')&&el.value.trim()){el.value=fmt(n(el.value));el.dispatchEvent(new Event('input',{bubbles:true}));}});
  a.addEventListener('submit',ev=>{ev.preventDefault();doSave();});
  a.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const d=S.draft,act=b.dataset.act;
    if(act==='type'){S.draft=newDraft(b.dataset.t,d.d);drawForm();}
    else if(act==='term'){d.term=b.dataset.v;if(d.term==='date'&&!d.due)d.due=addDaysTo(d.d,30);drawForm();}
    else if(act==='addline'){d.lines.push({p:'',q:'',qd:'',x:''});drawForm();}
    else if(act==='rmline'){d.lines.splice(+b.dataset.i,1);if(!d.lines.length)d.lines.push({p:'',q:'',qd:'',x:''});drawForm();}
    else if(act==='addrow'){d[b.dataset.l].push({name:'',a:'',nota:'',due:''});drawForm();}
    else if(act==='rmrow'){d[b.dataset.l].splice(+b.dataset.i,1);drawForm();}
    else if(act==='cancel-edit'){const id=S.editing&&S.editing.id;S.editing=null;S.draft=null;S.viewId=id;location.hash='#view';}
    else if(act==='quickprod'){
      const brand=$('#qp-brand').value.trim(),size=$('#qp-size').value.trim();
      if(!brand||!size)return($('#formErr').textContent='A new tire needs at least a brand and a size code.');
      if(!editable())return($('#formErr').textContent='Tires can only be added to real records.');
      const id='p'+uid();try{await store.setProduct(id,{brand,size,pattern:$('#qp-pattern').value.trim(),cat:'Truck',price:n($('#qp-price').value),low:0});
        const empty=d.lines.find(l=>!l.p);if(empty)empty.p=id;else d.lines.push({p:id,q:'',qd:'',x:''});toast('Tire added');setTimeout(drawForm,250);}catch(x){$('#formErr').textContent=friendly(x);}
    }});
}
async function doSave(){
  const d=S.draft,t=d.t,errEl=$('#formErr');const err=m=>{errEl.textContent=m;};err('');
  if(S.demo)return err('Example mode: entries are not saved. Use "Back to real records" at the top.');
  if(!editable())return err('This page is view only for you.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.d))return err('Pick a date.');
  if(d.d>today())return err('The date is in the future. Use today or an earlier date.');
  if(t==='opening'){const other=D().entries.find(x=>x.t==='opening'&&(!S.editing||x.id!==S.editing.id));if(other)return err(`Starting balances were already entered on ${nice(other.d)}. Open them from Transactions and press Fix this instead.`);
    const first=D().entries.filter(x=>x.t!=='opening'&&(!S.editing||x.id!==S.editing.id)).map(x=>x.d).sort()[0];if(first&&first<d.d)return err(`There are transactions from ${nice(first)}, before this date. Starting balances must be dated on or before the first transaction.`);}
  if((t==='sale'||t==='purchase')&&d.term==='date'&&d.due&&d.due<d.d)return err('The due date is before the invoice date.');
  const T=totals(d);const lines=d.lines.filter(l=>l.p&&(n(l.q)!==0||(t==='purchase'&&n(l.qd))));
  if(d.lines.some(l=>!l.p&&(n(l.q)||n(l.x)||n(l.qd))))return err('One line has a quantity but no tire chosen.');
  const e={id:S.editing?S.editing.id:'e'+uid(),t,d:d.d,ts:S.editing?S.editing.ts:Date.now(),note:(d.note||'').trim()};
  e.by=S.editing&&S.editing.by?S.editing.by:(S.me&&S.me.name)||'';if(S.editing)e.editedBy=(S.me&&S.me.name)||'';
  const needAmt=()=>{if(!(n(d.a)>0)){err('Enter an amount above zero.');return false;}return true;};
  const nota=(d.nota||'').trim();
  if(t==='sale'||t==='purchase'){
    if(t==='sale'&&!nota)return err('Type the invoice number from the paper invoice.');
    if(nota){const dup=D().entries.find(x=>x.t===t&&x.id!==e.id&&String(x.nota||'').trim().toLowerCase()===nota.toLowerCase());if(dup)return err(`${t==='sale'?'Invoice':'DO'} ${nota} is already recorded on ${nice(dup.d)}. Open it from Transactions instead.`);}
    if(!d.k.trim())return err(t==='sale'?'Add the shop\'s name.':'Add the supplier\'s name.');
    if(!lines.length)return err('Add at least one tire.');
    if(lines.some(l=>!n(l.x)))return err(t==='sale'?'Every tire needs a price.':'Every tire needs its cost.');
    if(t==='purchase'&&d.lines.some(l=>l.p&&l.q===''))return err('Type what the warehouse counted for each tire.');
    if(T.paid>T.total+0.5)return err('Paid now is more than the total.');
    if(d.term!=='cash'&&!dueOf(d))return err('Pick the due date.');
  }
  if((t==='recv'||t==='pay')&&!d.k.trim())return err(t==='recv'?'Which shop paid?':'Who did you pay?');
  if(['recv','pay','expense','capital','draw','transfer'].includes(t)&&!needAmt())return;
  if(t==='transfer'&&d.from===d.to)return err('From and To must be different.');
  if(t==='adjust'&&!lines.length)return err('Add at least one tire with a difference.');
  const btn=$('#saveBtn');btn.disabled=true;
  try{
    const kind=t==='sale'||t==='recv'?'customer':'supplier';
    if(['sale','purchase','recv','pay'].includes(t))e.k=await ensureContact(d.k,kind);
    if(t==='sale')Object.assign(e,{nota,lines:lines.map(l=>({p:l.p,q:n(l.q),u:n(l.x)})),disc:n(d.disc),ship:n(d.ship),shipAcct:d.shipAcct||d.acct,term:d.term,due:dueOf(d),paid:T.paid,acct:d.acct});
    if(t==='purchase')Object.assign(e,{nota,lines:lines.map(l=>({p:l.p,qd:l.qd===''?n(l.q):n(l.qd),q:n(l.q),c:n(l.x)})),extra:n(d.extra),term:d.term,due:dueOf(d),paid:T.paid,acct:d.acct});
    if(t==='recv'||t==='pay')Object.assign(e,{a:n(d.a),acct:d.acct,alloc:d.alloc.slice()});
    if(t==='capital'||t==='draw')Object.assign(e,{a:n(d.a),acct:d.acct});
    if(t==='expense')Object.assign(e,{a:n(d.a),acct:d.acct,cat:d.cat});
    if(t==='transfer')Object.assign(e,{a:n(d.a),from:d.from,to:d.to});
    if(t==='adjust')e.lines=lines.map(l=>({p:l.p,q:n(l.q)}));
    if(t==='opening'){
      e.bal={};for(const a of accts())if(n(d.bal[a.id]))e.bal[a.id]=n(d.bal[a.id]);
      e.lines=lines.map(l=>({p:l.p,q:n(l.q),c:n(l.x)}));e.recv=[];e.pay=[];
      for(const r of d.recv)if(r.name.trim()&&n(r.a))e.recv.push({k:await ensureContact(r.name,'customer'),a:n(r.a),nota:(r.nota||'').trim(),due:r.due||d.d});
      for(const r of d.pay)if(r.name.trim()&&n(r.a))e.pay.push({k:await ensureContact(r.name,'supplier'),a:n(r.a),nota:(r.nota||'').trim(),due:r.due||d.d});
    }
    lsSet('tsb-acct',d.acct);
    await saveEntry(e,S.editing?S.editing.d:null);
    S.saved={id:e.id,edited:!!S.editing};S.editing=null;S.draft=null;S.formMounted=false;location.hash='#saved';render();window.scrollTo(0,0);
  }catch(x){err(friendly(x));}
  finally{const b=$('#saveBtn');if(b)b.disabled=!editable();}
}
function nextNotaAfter(s){const m=String(s).match(/^(\D*)(\d+)(\D*)$/);if(!m)return nextNota();return m[1]+String(parseInt(m[2],10)+1).padStart(m[2].length,'0')+m[3];}

  return `<section class="wrap"><h1 class="h1">Shops and suppliers</h1>
    <div class="row" style="margin-top:18px;gap:10px 40px"><span>Shops owe you <strong>${M(c.arTot)}</strong></span><span>You owe suppliers <strong>${M(c.apTot)}</strong></span></div>${form}
    <div class="tbl" style="margin-top:24px"><table><thead><tr><th>Name</th><th>Kind</th><th class="num">Owes you</th><th class="num">You owe</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="small">Shops and suppliers appear here as soon as you name them on a invoice or DO.</td></tr>'}</tbody></table></div></section>`;

const KDESC={sale:'Copy a paper invoice: which shop, which tires, paid now or later.',recv:'A shop paid for one or more invoices.',purchase:'A DO from Jakarta arrived at the warehouse.',expense:'Rent, wages, shipping, fuel, electricity.',pay:'You paid Jakarta for tires that arrived earlier.',transfer:'Ci Bella handed money over, or cash went into the bank.',adjust:'The real count in the warehouse is different from the book.',capital:'The owner added their own money.',draw:'The owner took money for personal use.',opening:'Do this once, on the day you start using the book.'};
const LESS=['pay','transfer','adjust','capital','draw','opening'];
const longToday=()=>new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const dayLabel=d=>d===today()?'Today':d===addDays(-1)?'Yesterday':nice(d);
function shortDesc(e){
  const q=(e.lines||[]).reduce((a,l)=>a+n(l.q),0),P=[];
  switch(e.t){
    case 'sale':P.push(e.nota&&'Invoice '+e.nota,cname(e.k),q+' tires');break;
    case 'recv':P.push(cname(e.k),'to '+aname(e.acct));break;
    case 'purchase':P.push(e.nota&&'DO '+e.nota,cname(e.k),q+' tires');break;
    case 'pay':P.push(cname(e.k),'from '+aname(e.acct));break;
    case 'expense':P.push(e.cat,'from '+aname(e.acct));break;
    case 'transfer':{const fr=e.from||'cash';P.push(aname(fr)+' to '+aname(e.to||(fr==='bank'?'cash':'bank')));break;}
    case 'adjust':(e.lines||[]).forEach(l=>P.push((n(l.q)>0?'+':'')+n(l.q)+' '+pname(l.p)));break;
    case 'capital':P.push('into '+aname(e.acct));break;
    case 'draw':P.push('from '+aname(e.acct));break;
    case 'opening':P.push('Money, warehouse and unpaid invoices on day one');break;
  }
  return esc(P.filter(Boolean).join(' · '));
}
function txnRow(e,c){
  const tot=entryTotal(e),o=c.byId[e.id];let chip='';
  if(e.t==='sale'&&o&&o.open>0.5)chip=stTag(o);
  if(e.t==='purchase'&&(e.lines||[]).some(l=>l.qd!=null&&n(l.qd)!==n(l.q)))chip='<span class="tag late">Count differs</span>';
  return `<button type="button" class="txn" data-act="view" data-id="${e.id}"><span class="tk">${esc(TYPES[e.t])} ${chip}</span><span class="tdsc">${shortDesc(e)}</span><span class="tamt">${tot==null?'':M(tot)}</span></button>`;
}
function effects(e){
  const L=[],qty=(e.lines||[]).reduce((a,l)=>a+n(l.q),0);
  switch(e.t){
    case 'sale':{const tot=entryTotal(e),paid=n(e.paid),rest=tot-paid;L.push(`Warehouse: ${qty} tires out`);
      if(paid)L.push(`${rp(paid)} received by ${aname(e.acct)}`);
      if(rest>0.5)L.push(`${cname(e.k)} owes ${rp(rest)} more, due ${nice(e.due)}`);
      if(n(e.ship))L.push(`Shipping ${rp(e.ship)} paid from ${aname(e.shipAcct||e.acct)}`);break;}
    case 'recv':L.push(`${rp(e.a)} received by ${aname(e.acct)}`,`${cname(e.k)} owes ${rp(e.a)} less`);break;
    case 'purchase':{const tot=entryTotal(e),paid=n(e.paid);L.push(`Warehouse: ${qty} tires in`);
      (e.lines||[]).filter(l=>l.qd!=null&&n(l.qd)!==n(l.q)).forEach(l=>L.push(`${pname(l.p)}: DO says ${n(l.qd)}, warehouse counted ${n(l.q)}`));
      if(paid)L.push(`${rp(paid)} paid from ${aname(e.acct)}`);
      if(tot-paid>0.5)L.push(`You owe ${cname(e.k)} ${rp(tot-paid)} more${e.due?', due '+nice(e.due):''}`);break;}
    case 'pay':L.push(`${rp(e.a)} paid from ${aname(e.acct)}`,`You owe ${cname(e.k)} ${rp(e.a)} less`);break;
    case 'expense':L.push(`${rp(e.a)} paid from ${aname(e.acct)} for ${e.cat||'Other'}`);break;
    case 'transfer':{const fr=e.from||'cash',tt=e.to||(fr==='bank'?'cash':'bank');L.push(`${aname(fr)}: ${rp(-n(e.a))}`,`${aname(tt)}: +${rp(e.a)}`);break;}
    case 'adjust':(e.lines||[]).forEach(l=>L.push(`Warehouse: ${n(l.q)>0?'+':''}${n(l.q)} ${pname(l.p)}`));break;
    case 'capital':L.push(`${aname(e.acct)}: +${rp(e.a)}`);break;
    case 'draw':L.push(`${aname(e.acct)}: ${rp(-n(e.a))}`);break;
    case 'opening':{const b=e.bal||{};Object.keys(b).forEach(k=>L.push(`${aname(k)}: ${rp(b[k])}`));L.push(`Warehouse: ${qty} tires`);
      if((e.recv||[]).length)L.push(`${e.recv.length} unpaid invoice${e.recv.length===1?'':'s'} from before`);if((e.pay||[]).length)L.push(`${e.pay.length} unpaid DO${e.pay.length===1?'':'s'} to Jakarta`);break;}
  }
  return L;
}
function detailRows(e){
  const R=[],add=(k,v)=>{if(v!==''&&v!=null)R.push([k,v]);};
  add('Date',esc(nice(e.d)));
  if(e.nota)add(e.t==='purchase'?'DO number':'Invoice number',`<span class="notano">${esc(e.nota)}</span>`);
  if(e.k)add(['sale','recv'].includes(e.t)?'Shop':'Supplier',esc(cname(e.k)));
  if(e.lines&&e.lines.length)add('Tires',e.lines.map(l=>`${n(l.q)} × ${pH(l.p)}${l.u!=null?' at '+fmt(l.u):l.c!=null?' at '+fmt(l.c):''}${l.qd!=null&&n(l.qd)!==n(l.q)?` <span class="small neg">(DO ${n(l.qd)})</span>`:''}`).join('<br>'));
  if(n(e.disc))add('Discount',rp(e.disc));if(n(e.extra))add('Delivery cost',rp(e.extra));if(n(e.ship))add('Shipping',rp(e.ship));
  const tot=entryTotal(e);if(tot!=null&&e.t!=='opening')add('Total',`<strong>${M(tot)}</strong>`);
  if(e.t==='sale'||e.t==='purchase')add('Payment',!e.term||e.term==='cash'?'Paid in full':`${e.term==='date'?'Credit':e.term+' days'}, due ${esc(nice(e.due))}${n(e.paid)?`, ${rp(e.paid)} paid now`:''}`);
  if(e.t==='expense')add('For',esc(e.cat));
  if((e.t==='sale'&&n(e.paid))||e.t==='recv')add('Received by',esc(aname(e.acct)));
  if(['pay','expense','draw'].includes(e.t)||(e.t==='purchase'&&n(e.paid)))add('Paid from',esc(aname(e.acct)));
  if(e.t==='capital')add('Into',esc(aname(e.acct)));
  if(e.t==='transfer'){const fr=e.from||'cash';add('Moved',`${esc(aname(fr))} to ${esc(aname(e.to||(fr==='bank'?'cash':'bank')))}`);}
  if(e.note)add('Note',esc(e.note));
  if(e.by)add('Recorded by',esc(e.by)+(e.editedBy&&e.editedBy!==e.by?`, changed by ${esc(e.editedBy)}`:''));
  return R;
}
const kvList=R=>R.map(([k,v])=>`<div class="lrow"><span class="small">${k}</span><span style="text-align:right">${v}</span></div>`).join('');

function weeklySales(k){const out=[];for(let i=k-1;i>=0;i--){const to=addDays(-7*i),from=addDays(-7*i-6);out.push({from,to,v:compute(from,to).P.net});}return out;}
function salesChart(W){

function period(){
  const r=S.rp;const y=new Date().getFullYear();
  if(r.preset==='this')return monthRange(0);
  if(r.preset==='last')return monthRange(-1);
  if(r.preset==='year')return [y+'-01-01',y+'-12-31'];
  if(r.preset==='all')return [START,FAR];

}

  if(tab==='pl'){
    h('Revenue');it('Sales',P.goods,1,'Everything invoiced on invoices, paid or not.');if(P.disc)it('Sales discounts',-P.disc,1);

    h('Assets');kasRows();it('Accounts receivable',c.arGross,1,'Unpaid invoices.');if(c.apCredit>0.5)it('Advances to suppliers',c.apCredit,1,'Paid to suppliers beyond what was owed.');it('Inventory',c.stockVal,1,'Tires in the warehouse at moving average cost.');tot('Total assets',c.money+c.arGross+c.apCredit+c.stockVal);
    h('Liabilities');it('Accounts payable',c.apGross,1,'Unpaid DOs to Jakarta and other suppliers.');if(c.arCredit>0.5)it('Customer deposits',c.arCredit,1,'Paid by shops beyond what they owed; used on their next invoice.');tot('Total liabilities',c.apGross+c.arCredit);
    h('Equity');it('Opening equity',c.eqOpen,1,'From the starting balances.');if(c.cap)it('Additional owner capital',c.cap,1);if(c.draw)it('Owner drawings',-c.draw,1);it('Retained earnings',c.profit,1,'All profit since the book started.');tot('Total equity',c.equity);

    const op=C.saleCash+C.arIn-C.buyCash-C.apOut-C.expOut;tot('Net cash from operating activities',op);
    h('Cash flows from financing activities');it('Owner capital added',C.capIn,1);it('Owner drawings',-C.drawOut,1);const fin=C.capIn-C.drawOut;tot('Net cash from financing activities',fin);
    tot('Net increase (decrease) in cash',op+fin);it('Cash at the start of the period',start);grand('Cash at the end of the period',c.money);kasRows();
    note('Direct method. No investing activities recorded.');
  }else if(tab==='ar'){
    const asOf=to>today()?today():to,B=[['Not yet due',-1e9,0],['1 to 30 days late',1,30],['31 to 60 days late',31,60],['61 to 90 days late',61,90],['More than 90 days late',91,1e9]];
    for(const [lab,lo,hi] of B){const L=c.openAR.filter(o=>{const dd=daysBetween(o.due,asOf);return dd>=lo&&dd<=hi;});if(!L.length)continue;h(lab);L.forEach(o=>it(`${o.nota||'No number'}, ${cname(o.k)}, due ${niceL(o.due)}`,o.open,1));tot('Subtotal',L.reduce((a,o)=>a+o.open,0));}
    grand('Total accounts receivable',c.arGross);

/* ---------- photos: shrunk in the browser, then stored with the page ---------- */
async function shrink(file){
  let bmp=null;try{bmp=await createImageBitmap(file);}catch(_){return null;}
  const k=Math.min(1,900/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.85));
}

    const path=await store.uploadPhoto(blob);const old=S.live.products[pid]&&S.live.products[pid].img;
    await store.patchProduct(pid,{img:path});if(old)store.deletePhoto(old);toast('Photo saved');}
  catch(x){toast('Could not save the photo. '+friendly(x));}
}
