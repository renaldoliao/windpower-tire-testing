<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Windpower Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Concept: a tire shop's carbon-copy nota book on ruled ledger paper. Tire size codes are stamped in mono like sidewall lettering.
   Layout: overview anchored left with one huge figure; record is form one side, live nota the other; statements are a centred printed sheet; stock runs edge to edge. */
:root{
  color-scheme:light;
  --paper:#e8e6df;   /* Ledger Grey: page canvas */
  --sheet:#f6f5f0;   /* Top Copy: forms, statements, bands */
  --ink:#1d1c19;     /* Rubber: all text */
  --muted:#67645c;   /* Pencil: labels and secondary text */
  --rule:#c6c2b6;    /* Ruling: every 1px line */
  --carbon:#2c3c91;  /* Carbon Blue: things you click, nothing else */
  --loss:#a1302a;    /* Loss Red: negative amounts and warnings only */
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#171614;--sheet:#211f1c;--ink:#ebe8df;--muted:#9c978b;--rule:#3b3933;--carbon:#a3b0f2;--loss:#e88d83;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171614;--sheet:#211f1c;--ink:#ebe8df;--muted:#9c978b;--rule:#3b3933;--carbon:#a3b0f2;--loss:#e88d83;color-scheme:dark}

html,body{background:var(--paper);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.login{max-width:440px;display:grid;gap:18px}
body{color:var(--ink);font:400 15px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--carbon)}
:focus-visible{outline:1px solid var(--carbon);outline-offset:3px}

/* type scale: 112 / 64 / 28 / 15 / 13 / 11 */
.display{font-size:clamp(52px,12.5vw,112px);line-height:.86;letter-spacing:-0.045em;font-weight:400;margin:0;text-wrap:balance}
.h1{font-size:clamp(38px,7.5vw,64px);line-height:.95;letter-spacing:-0.03em;font-weight:400;margin:0;text-wrap:balance}
.h2{font-size:28px;line-height:1.1;letter-spacing:-0.015em;font-weight:400;margin:0}
.small{font-size:13px;letter-spacing:.01em;color:var(--muted)}
.micro{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:0;font-weight:500}
.size{font-family:var(--mono);letter-spacing:.06em;font-size:.95em}
.neg{color:var(--loss)}
p{margin:0}
.prose{max-width:62ch;display:grid;gap:12px}

/* header: wordmark, one row of text links */
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 28px;padding-block:22px 14px;border-bottom:1px solid var(--rule)}
.mark{color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;letter-spacing:-0.01em}
.mark .micro{margin-left:10px}
nav{display:flex;flex-wrap:wrap;gap:4px 20px}
nav a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.02em;padding-block:4px}
nav a[aria-current="page"]{color:var(--carbon);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.banner{border-bottom:1px solid var(--rule);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}

section{padding-block:40px}
.band{background:var(--sheet)}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

/* controls: pills for actions, ruled lines for inputs */
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--carbon);border-color:var(--carbon);color:var(--sheet)}
.btn:disabled{opacity:.5;cursor:default}
.link{color:var(--carbon);background:none;border:0;padding:0;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--loss)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--carbon);color:var(--carbon)}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--muted);border-radius:0;padding:7px 0;width:100%;min-width:0}
textarea{border:1px solid var(--rule);padding:10px;min-height:150px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);background-position:right 6px top 55%,right 1px top 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:18px}
select option{background:var(--sheet);color:var(--ink)}
input.num{text-align:right}
.fld{display:grid;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px 24px}
.tag{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5;white-space:nowrap}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.lines td{padding-block:6px;vertical-align:middle}
.lines td:first-child{min-width:200px}
.lines input{min-width:90px}

/* overview */
.hero{padding-block:48px 36px;display:grid;gap:18px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:15px}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 56px}
.lrow{display:flex;justify-content:space-between;gap:16px;padding-block:13px;border-bottom:1px solid var(--rule);align-items:baseline}
.lrow .v{font-size:20px;letter-spacing:-0.01em;white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:40px 56px}

/* record: form one side, nota the other */
.recgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;align-items:start;margin-top:24px}
@media (max-width:900px){.recgrid{grid-template-columns:1fr}}
.nota{background:var(--sheet);padding:24px;display:grid;gap:10px;border-top:1px solid var(--ink)}
.nota .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.nota .big{font-size:clamp(30px,3.6vw,46px);line-height:.95;letter-spacing:-0.025em;white-space:nowrap}
.nota hr{border:0;border-top:1px dashed var(--rule);margin:6px 0;width:100%}
.hint{font-size:13px;color:var(--muted);max-width:70ch}
.err{color:var(--loss);font-size:14px;min-height:1.2em}
details summary{cursor:pointer;color:var(--carbon);font-size:13px;text-decoration:underline;text-underline-offset:3px;list-style:none}
details summary::-webkit-details-marker{display:none}
.quick{display:grid;gap:12px;padding-block:14px}

/* statements: centred printed sheet */
.statement{max-width:780px;margin:28px auto 0;background:var(--sheet);padding:44px clamp(18px,5vw,60px) 40px;display:grid;gap:22px}
.statement .head{text-align:center;display:grid;gap:10px;justify-items:center}
.srow{display:flex;justify-content:space-between;gap:16px;padding-block:9px;border-bottom:1px solid var(--rule);animation:rin .5s var(--ease) both}
.srow.ind{padding-left:20px}
.srow.headr{border-bottom:1px solid var(--ink);padding-top:20px}
.srow.headr span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:500}
.srow.total{font-weight:500}
.srow.grand{font-size:22px;letter-spacing:-0.01em;border-bottom:1px solid var(--ink);padding-block:14px}
.srow.note{color:var(--muted);font-size:13px;border:0}
@keyframes rin{from{opacity:.15;transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.srow{animation:none}}
.stamp{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.stamp.off{border-color:var(--loss);color:var(--loss)}

/* skeleton */
.skel{background:var(--sheet);display:block}
.skel.a{height:14px;width:180px;margin-bottom:22px}
.skel.b{height:96px;width:min(560px,90%);margin-bottom:28px}
.skel.c{height:44px;width:100%;margin-bottom:2px}

.empty{padding-block:28px;border-top:1px solid var(--rule);display:grid;gap:12px}
footer{border-top:1px solid var(--rule);margin-top:56px;padding-block:18px 28px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
strong{font-weight:500}
.thumb{display:block;object-fit:cover;background:var(--sheet);border:1px solid var(--rule);flex:none}
.thumb.ph{border-radius:50%;position:relative}
.thumb.ph::after{content:"";position:absolute;inset:28%;border:1px solid var(--rule);border-radius:50%}
.tire{display:flex;gap:14px;align-items:flex-start}
.ex{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.01em;line-height:1.4;margin-top:2px;font-weight:400}
.srow>span:first-child{min-width:0}
.srow>span:last-child{white-space:nowrap}
.summary{font-size:17px;line-height:1.5;letter-spacing:-0.005em;max-width:58ch;margin:0 auto;text-align:center;text-wrap:pretty}
.pricebar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end;padding-block:18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:22px}
input.price{width:130px;border-bottom-color:var(--carbon)}
.changed{display:block;color:var(--carbon);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 18px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

/* v3: wholesale flow, mobile entry */
.lineRow{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(var(--cols,2),minmax(70px,1fr)) minmax(90px,1fr) auto;gap:8px 14px;align-items:end;padding-block:8px;border-bottom:1px solid var(--rule)}
.lineRow .lt{text-align:right;font-size:13px;color:var(--muted);padding-bottom:9px;white-space:nowrap}
.lineRow .rm{padding-bottom:9px}
.lineHead{display:contents}
@media (max-width:640px){.lineRow{grid-template-columns:repeat(2,minmax(0,1fr))}.lineRow .lp{grid-column:1/-1}.lineRow .lt{text-align:left}}
.alloc{display:grid;gap:0;border-top:1px solid var(--ink)}
.alloc label{display:flex;gap:12px;align-items:center;padding-block:11px;border-bottom:1px solid var(--rule);cursor:pointer}
.alloc input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--carbon);border:0;padding:0}
.alloc .amt{margin-left:auto;white-space:nowrap}
.tag.late{color:var(--loss)}
.tag.ok{color:var(--muted)}
.notano{font-family:var(--mono);letter-spacing:.04em}
@media (max-width:640px){input,select,textarea{font-size:16px}}
@media (pointer:coarse){.btn{min-height:46px;padding-inline:22px}.seg button{min-height:42px;padding-inline:16px}.link{padding-block:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="mark" href="#overview"><span id="bizName">Windpower Books</span><span class="micro">Books</span></a>
    <nav id="nav">
      <a href="#overview">Overview</a><a href="#record">Record</a><a href="#unpaid">Unpaid</a><a href="#journal">Journal</a><a href="#stock">Stock</a><a href="#people">People</a><a href="#reports">Reports</a><a href="#setup">Setup</a>
    </nav>
  </header>
  <div id="banner"></div>
</div>
<main id="main"></main>
<div class="wrap"><footer><span>All amounts in Rupiah. Tire cost uses the moving average method.</span><a href="#terms">Terms of use</a><a href="#privacy">Privacy</a><span id="who"></span></footer></div>
<div id="toast" hidden></div>
<input type="file" id="photoPick" accept="image/*" hidden>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* numbers: accepts Indonesian style 1.250.000 or 1250000, minus allowed */
const n=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').trim();if(!s)return 0;s=s.replace(/rp/ig,'').replace(/\s/g,'');const neg=/^-/.test(s);s=s.replace(/[^0-9.,]/g,'').replace(/\./g,'').replace(',','.');const x=parseFloat(s);return isFinite(x)?(neg?-x:x):0;};
const fmt=x=>Math.round(x||0).toLocaleString('id-ID');
const rp=x=>{const v=Math.round(x||0);return (v<0?'-':'')+'Rp '+Math.abs(v).toLocaleString('id-ID');};
const M=x=>`<span class="${Math.round(x||0)<0?'neg':''}">${rp(x)}</span>`;
const pad=x=>String(x).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const addDaysTo=(s,k)=>{const d=parseD(s);d.setDate(d.getDate()+k);return iso(d);};
const addDays=k=>addDaysTo(today(),k);
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const nice=s=>s?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const short=s=>s?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const monthRange=off=>{const d=new Date();return [iso(new Date(d.getFullYear(),d.getMonth()+off,1)),iso(new Date(d.getFullYear(),d.getMonth()+off+1,0))];};
const monthLabel=s=>parseD(s).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const FAR='9999-12-31', START='0000-01-01';
const lsGet=k=>{try{return localStorage.getItem(k);}catch(_){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}};

const ORDER=['sale','recv','purchase','expense','pay','transfer','adjust','capital','draw','opening'];
const MAIN=['sale','recv','purchase','expense'];
const TYPES={sale:'Sale',recv:'Payment received',purchase:'Goods received',expense:'Expense',pay:'Paid supplier',transfer:'Money moved',adjust:'Stock count',capital:'Owner put in',draw:'Owner took out',opening:'Opening balances'};
const HINTS={
  sale:'Copy one paper nota. If the shop pays later, pick how many days they have. The book keeps the nota open until it is fully paid. A returned tire: enter it with a minus quantity.',
  recv:'A shop paying for a nota. Always pick who received the money, so nothing gets lost. Tick the notas this pays for.',
  purchase:'Tires arriving from Jakarta. Type what the DO says and what the warehouse counted. The stock goes up by the counted number.',
  pay:'Paying Jakarta (or another supplier) for goods received earlier. Tick the DOs this pays for.',
  expense:'Running costs: rent, wages, electricity, fuel, ongkir not linked to a nota. Tire purchases go under Goods received, not here.',
  transfer:'Money changing hands inside the business. For example Ci Bella handing collected money to Ci Via, or cash deposited into the bank. Profit does not change.',
  adjust:'After counting the warehouse, enter only the difference. Missing or damaged tires: a minus number. Extra tires found: a plus number.',
  capital:'The owner\'s own money put into the business.',
  draw:'Money the owner takes out for personal use. This is not a business cost, so it does not lower profit.',
  opening:'Do this once, on your start date. Write down what the business has on day one: money each person holds, the bank, tires in the warehouse, unpaid notas, and what you owe Jakarta.'
};
const SHIP='Shipping (ongkir)';
const DEF_CATS=[SHIP,'Salaries and wages','Rent','Electricity and water','Transport and fuel','Loading and unloading','Phone and internet','Repairs and upkeep','Taxes and permits','Bank fees','Other'];
const DEF_ACCTS=[{id:'cash',name:'Cash (Ci Via)'},{id:'bella',name:'Cash (Ci Bella)'},{id:'bank',name:'Bank'}];
const TERMS=[['cash','Paid in full now'],['7','7 days'],['14','14 days'],['30','30 days'],['date','Pick a date']];

const S={mode:'loading',db:null,user:null,uid:null,canWrite:true,demo:false,slow:false,err:'',ready:{p:0,c:0,d:0,m:0},
  live:{products:{},contacts:{},days:{},setup:{}},ver:0,cache:{},draft:null,editing:null,formMounted:false,lastRoute:'',allocKey:null,
  rp:{preset:'this',from:'',to:'',tab:'pl'},jr:{month:today().slice(0,7),type:''},prodEdit:null,contEdit:null,delArm:null,
  priceEdits:{},explain:true,assets:null,photoFor:null,sb:null,me:null,authView:'signin',authMsg:''};
S.live.entries=[];S.live.members=[];

/* ---------- example data, only shown in example mode, never saved ---------- */
let _demo=null;
function DEMO(){
  if(_demo)return _demo;
  const products={p1:{brand:'Windpower',size:'7.50-16',pattern:'WGC29',cat:'Truck',price:2050000,low:15},p2:{brand:'Windpower',size:'7.50-16',pattern:'WSR81',cat:'Truck',price:2050000,low:15}};
  const contacts={c1:{name:'Windpower Jakarta (example)',kind:'supplier',phone:''},c2:{name:'Toko Sumber Ban (example)',kind:'customer',phone:''},c3:{name:'Toko Maju Jaya (example)',kind:'customer',phone:''},c4:{name:'UD Lancar Lahat (example)',kind:'customer',phone:''}};
  let i=0;const E=(off,o)=>Object.assign({id:'x'+(++i),d:addDays(off),ts:i,note:''},o);
  const entries=[
    E(-45,{t:'opening',bal:{cash:15000000,bella:0,bank:120000000},lines:[{p:'p1',q:30,c:1760000},{p:'p2',q:20,c:1790000}],recv:[{k:'c3',a:12300000,nota:'00640',due:addDays(-6)}],pay:[{k:'c1',a:35000000,nota:'DO-2291',due:addDays(-15)}]}),
    E(-40,{t:'purchase',k:'c1',nota:'DO-2307',lines:[{p:'p1',qd:40,q:40,c:1765000},{p:'p2',qd:30,q:29,c:1795000}],extra:1500000,paid:0,acct:'bank',term:'30',due:addDays(-10),note:'One WSR81 short, claimed to Jakarta'}),
    E(-38,{t:'sale',k:'c2',nota:'00651',lines:[{p:'p1',q:10,u:2050000}],disc:0,ship:0,term:'14',due:addDays(-24),paid:0,acct:'cash'}),
    E(-30,{t:'pay',k:'c1',a:35000000,acct:'bank',alloc:[]}),
    E(-28,{t:'recv',k:'c2',a:20500000,acct:'bella',alloc:[]}),
    E(-25,{t:'expense',cat:'Rent',a:3500000,acct:'bank'}),
    E(-20,{t:'sale',k:'c3',nota:'00654',lines:[{p:'p2',q:8,u:2050000}],disc:0,ship:0,term:'cash',paid:16400000,acct:'cash'}),
    E(-15,{t:'sale',k:'c4',nota:'00655',lines:[{p:'p1',q:12,u:2050000},{p:'p2',q:6,u:2050000}],disc:0,ship:450000,shipAcct:'cash',term:'30',due:addDays(15),paid:5000000,acct:'bank'}),
    E(-12,{t:'transfer',from:'bella',to:'bank',a:20500000}),
    E(-10,{t:'sale',k:'c2',nota:'00656',lines:[{p:'p1',q:6,u:2050000}],disc:0,ship:0,term:'7',due:addDays(-3),paid:0,acct:'cash'}),
    E(-8,{t:'expense',cat:'Salaries and wages',a:6000000,acct:'cash'}),
    E(-5,{t:'sale',k:'c3',nota:'00657',lines:[{p:'p2',q:15,u:2050000},{p:'p1',q:10,u:2050000}],disc:0,ship:0,term:'30',due:addDays(25),paid:0,acct:'cash'}),
    E(-3,{t:'recv',k:'c3',a:12300000,acct:'bella',alloc:[]}),
    E(-2,{t:'adjust',lines:[{p:'p2',q:-1}],note:'One tire damaged in the warehouse'}),
    E(-1,{t:'draw',a:3000000,acct:'cash'}),
    E(-1,{t:'purchase',k:'c1',nota:'DO-2318',lines:[{p:'p1',qd:30,q:30,c:1770000}],extra:0,paid:0,acct:'bank',term:'30',due:addDays(29)})
  ];
  _demo={products,contacts,setup:{name:'Example Windpower Distributor'},entries};return _demo;
}
function liveEntries(){
  const k='le'+S.ver;if(S.cache[k])return S.cache[k];
  const out=S.live.entries.filter(v=>v&&v.t);
  out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0));
  return S.cache[k]=out;
}
function D(){return S.demo?DEMO():{products:S.live.products,contacts:S.live.contacts,setup:S.live.setup,entries:liveEntries()};}
const cats=()=>{const c=D().setup.cats;return Array.isArray(c)&&c.length?c:DEF_CATS;};
const accts=()=>{const a=D().setup.accts;return Array.isArray(a)&&a.length?a:DEF_ACCTS;};

/* ---------- the accounting engine: replays every entry in date order ---------- */
function compute(from,to,ex){
  const key=[S.demo,S.ver,from,to,ex||''].join('|');if(S.cache[key])return S.cache[key];
  const st={},bal={},inv={ar:{},ap:{}},credit={ar:{},ap:{}},byId={};
  let eqOpen=0,cap=0,draw=0,profit=0,open=null;
  const P={goods:0,disc:0,cogs:0,exp:{},adj:0,sales:0,tires:0};
  const C={openIn:0,saleCash:0,arIn:0,capIn:0,buyCash:0,apOut:0,expOut:0,drawOut:0};
  const recvBy={},warn=[];
  const sk=p=>st[p]||(st[p]={q:0,v:0,last:0});
  const mv=(a,x)=>{a=a||'cash';bal[a]=(bal[a]||0)+x;};
  const avg=s=>s.q>0?s.v/s.q:s.last;
  const settle=s=>{if(Math.abs(s.q)<1e-9){s.q=0;s.v=0;}if(s.q>0)s.last=s.v/s.q;};
  const addInv=(side,k,o)=>{const c=credit[side][k]||0;if(c>0){const t=Math.min(c,o.open);o.open-=t;credit[side][k]=c-t;}o.k=k;o.side=side;(inv[side][k]||(inv[side][k]=[])).push(o);byId[o.id]=o;};
  const payInv=(side,k,amt,alloc)=>{const L=inv[side][k]||[];let left=amt;
    for(const id of alloc||[]){const o=L.find(x=>x.id===id);if(o&&left>0&&o.open>0){const t=Math.min(o.open,left);o.open-=t;left-=t;}}
    for(const o of L.filter(x=>x.open>0.5).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0)){if(left<=0)break;const t=Math.min(o.open,left);o.open-=t;left-=t;}
    if(left>0.5)credit[side][k]=(credit[side][k]||0)+left;};
  const owe=(side,e,tot,paid)=>{const o=tot-paid;if(o>0.5)addInv(side,e.k,{id:e.id,nota:e.nota||'',d:e.d,due:e.due||e.d,total:tot,open:o});else if(o<-0.5)credit[side][e.k]=(credit[side][e.k]||0)-o;};
  for(const e of D().entries){
    if(e.d>to)break;
    if(ex&&e.id===ex)continue;
    const inP=e.d>=from;
    if(inP&&!open)open={tot:Object.values(bal).reduce((a,b)=>a+b,0)};
    switch(e.t){
      case 'opening':{let tot=0;const b=Object.assign({},e.bal||{});if(e.cash)b.cash=(b.cash||0)+n(e.cash);if(e.bank)b.bank=(b.bank||0)+n(e.bank);
        for(const [a,v] of Object.entries(b)){mv(a,n(v));tot+=n(v);if(inP)C.openIn+=n(v);}
        (e.lines||[]).forEach(l=>{const s=sk(l.p),v=n(l.q)*n(l.c);s.q+=n(l.q);s.v+=v;settle(s);tot+=v;});
        (e.recv||[]).forEach((r,i)=>{if(!n(r.a))return;addInv('ar',r.k,{id:e.id+'-r'+i,nota:r.nota||'',d:e.d,due:r.due||e.d,total:n(r.a),open:n(r.a)});tot+=n(r.a);});
        (e.pay||[]).forEach((r,i)=>{if(!n(r.a))return;addInv('ap',r.k,{id:e.id+'-p'+i,nota:r.nota||'',d:e.d,due:r.due||e.d,total:n(r.a),open:n(r.a)});tot-=n(r.a);});
        eqOpen+=tot;break;}
      case 'purchase':{const L=e.lines||[];const sub=L.reduce((a,l)=>a+n(l.q)*n(l.c),0),extra=n(e.extra);
        L.forEach(l=>{const s=sk(l.p),base=n(l.q)*n(l.c);s.q+=n(l.q);s.v+=base+(sub?extra*base/sub:0);settle(s);});
        const tot=sub+extra,paid=n(e.paid);mv(e.acct,-paid);owe('ap',e,tot,paid);if(inP)C.buyCash+=paid;break;}
      case 'sale':{let goods=0,cogs=0,q=0;(e.lines||[]).forEach(l=>{const s=sk(l.p),lq=n(l.q),c=lq*avg(s);goods+=lq*n(l.u);q+=lq;s.q-=lq;s.v-=c;cogs+=c;settle(s);if(s.q<0)warn.push({d:e.d,p:l.p,q:s.q});});
        const tot=goods-n(e.disc),paid=n(e.paid),ship=n(e.ship);mv(e.acct,paid);owe('ar',e,tot,paid);
        if(ship){mv(e.shipAcct||e.acct,-ship);}
        profit+=tot-cogs-ship;
        if(inP){P.goods+=goods;P.disc+=n(e.disc);P.cogs+=cogs;P.sales++;P.tires+=q;C.saleCash+=paid;if(paid)recvBy[e.acct||'cash']=(recvBy[e.acct||'cash']||0)+paid;if(ship){P.exp[SHIP]=(P.exp[SHIP]||0)+ship;C.expOut+=ship;}}break;}
      case 'recv':{const a=n(e.a);mv(e.acct,a);payInv('ar',e.k,a,e.alloc);if(inP){C.arIn+=a;recvBy[e.acct||'cash']=(recvBy[e.acct||'cash']||0)+a;}break;}
      case 'pay':{const a=n(e.a);mv(e.acct,-a);payInv('ap',e.k,a,e.alloc);if(inP)C.apOut+=a;break;}
      case 'expense':{const a=n(e.a);mv(e.acct,-a);profit-=a;if(inP){P.exp[e.cat||'Other']=(P.exp[e.cat||'Other']||0)+a;C.expOut+=a;}break;}
      case 'adjust':{let tot=0;(e.lines||[]).forEach(l=>{const s=sk(l.p),q=n(l.q),v=q*avg(s);s.q+=q;s.v+=v;settle(s);tot+=v;});profit+=tot;if(inP)P.adj+=tot;break;}
      case 'capital':{const a=n(e.a);mv(e.acct,a);cap+=a;if(inP)C.capIn+=a;break;}
      case 'draw':{const a=n(e.a);mv(e.acct,-a);draw+=a;if(inP)C.drawOut+=a;break;}
      case 'transfer':{const a=n(e.a),fr=e.from||'cash',tt=e.to||(fr==='bank'?'cash':'bank');mv(fr,-a);mv(tt,a);break;}
    }
  }
  const money=Object.values(bal).reduce((a,b)=>a+b,0);
  if(!open)open={tot:money};
  const expTot=Object.values(P.exp).reduce((a,b)=>a+b,0);
  P.net=P.goods-P.disc;P.gross=P.net-P.cogs;P.expTot=expTot;P.profit=P.gross-expTot+P.adj;
  const side=sd=>{const m={};let t=0;const ks=new Set([...Object.keys(inv[sd]),...Object.keys(credit[sd])]);for(const k of ks){const v=(inv[sd][k]||[]).reduce((a,o)=>a+o.open,0)-(credit[sd][k]||0);m[k]=v;t+=v;}return [m,t];};
  const [ar,arTot]=side('ar'),[ap,apTot]=side('ap');
  const openInv=sd=>Object.values(inv[sd]).flat().filter(o=>o.open>0.5).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  const stockVal=Object.values(st).reduce((a,s)=>a+s.v,0);
  const assets=money+arTot+stockVal,equity=eqOpen+cap-draw+profit;
  return S.cache[key]={st,bal,money,ar,ap,arTot,apTot,inv,byId,openAR:openInv('ar'),openAP:openInv('ap'),credit,open,P,C,recvBy,warn,stockVal,assets,equity,eqOpen,cap,draw,profit,diff:assets-apTot-equity};
}
const now=()=>compute(START,FAR);
function status(o){const t=today();if(o.due<t){const k=daysBetween(o.due,t);return {late:true,txt:`Late ${k} day${k===1?'':'s'}`};}const k=daysBetween(t,o.due);return {late:false,txt:k===0?'Due today':`Due in ${k} day${k===1?'':'s'}`};}
const stTag=o=>{const s=status(o);return `<span class="tag ${s.late?'late':'ok'}">${s.txt}</span>`;};

const BUCKET='tire-photos';
async function q(p){const {data,error}=await p;if(error)throw error;return data;}
const store={
  saveEntry:e=>q(S.sb.from('entries').upsert({id:e.id,d:e.d,data:e,updated_at:new Date().toISOString()})),
  deleteEntry:id=>q(S.sb.from('entries').delete().eq('id',id)),
  setProduct:(id,data)=>q(S.sb.from('products').upsert({id,data,updated_at:new Date().toISOString()})),
  patchProduct:(id,patch)=>store.setProduct(id,Object.assign({},S.live.products[id]||{},patch)),
  setContact:(id,data)=>q(S.sb.from('contacts').upsert({id,data,updated_at:new Date().toISOString()})),
  patchContact:(id,patch)=>store.setContact(id,Object.assign({},S.live.contacts[id]||{},patch)),
  setSetup:data=>q(S.sb.from('settings').upsert({id:'setup',data,updated_at:new Date().toISOString()})),
  async uploadPhoto(blob){const path=uid()+'.jpg';await q(S.sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false}));return path;},
  deletePhoto:path=>S.sb.storage.from(BUCKET).remove([path]).catch(()=>{})
};
const photoUrl=path=>S.sb&&path?S.sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl:'';
async function saveEntry(e){await store.saveEntry(e);}
async function deleteEntry(e){await store.deleteEntry(e.id);}
async function ensureContact(name,kind){
  name=(name||'').trim();if(!name)return '';
  const cs=S.live.contacts;const id=Object.keys(cs).find(k=>(cs[k].name||'').trim().toLowerCase()===name.toLowerCase());
  if(id){const c=cs[id];if(c.kind!==kind&&c.kind!=='both')await store.patchContact(id,{kind:'both'});return id;}
  const nid='c'+uid();const data={name,kind,phone:''};await store.setContact(nid,data);S.live.contacts[nid]=data;return nid;
}
function friendly(x){if(!x)return 'Something went wrong.';const m=String(x.message||'');if(/row-level security|permission denied/i.test(m))return 'This account has not been given access yet. Ask the owner to add your email in Setup.';if(/JWT|expired/i.test(m))return 'You were signed out. Sign in again.';if(/fetch|network/i.test(m))return 'No connection. Check the internet and try again.';return 'Could not save: '+m;}

/* ---------- helpers ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},2600);}
function csv(rows){return rows.map(r=>r.map(c=>{const s=String(c??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');}
async function download(name,rows){
  try{const blob=new Blob(['\ufeff'+csv(rows)],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Saved '+name);}
  catch(e){toast('Could not save the file.');}
}
function entryTotal(e){
  switch(e.t){
    case 'sale':return (e.lines||[]).reduce((a,l)=>a+n(l.q)*n(l.u),0)-n(e.disc);
    case 'purchase':return (e.lines||[]).reduce((a,l)=>a+n(l.q)*n(l.c),0)+n(e.extra);
    case 'opening':return Object.values(e.bal||{}).reduce((a,v)=>a+n(v),0)+n(e.cash)+n(e.bank)+(e.lines||[]).reduce((a,l)=>a+n(l.q)*n(l.c),0);
    case 'adjust':return null;
    default:return n(e.a);
  }
}
const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
function describe(e,c){
  const qty=L=>(L||[]).reduce((a,l)=>a+n(l.q),0);
  const nota=e.nota?`<span class="notano">${esc(e.nota)}</span> `:'';
  switch(e.t){
    case 'sale':{const q=qty(e.lines),o=c&&c.byId[e.id];const tag=o&&o.open>0.5?' '+stTag(o):(Math.abs(entryTotal(e)-n(e.paid))>0.5&&!o?'':' <span class="tag ok">Paid</span>');
      return `${nota}${q} tire${q===1?'':'s'} to ${esc(cname(e.k))}${tag}${n(e.paid)?`<div class="small">${rp(e.paid)} received by ${esc(aname(e.acct))}</div>`:''}`;}
    case 'purchase':{const q=qty(e.lines),miss=(e.lines||[]).some(l=>l.qd!=null&&n(l.qd)!==n(l.q)),o=c&&c.byId[e.id];
      return `${nota}${q} tire${q===1?'':'s'} from ${esc(cname(e.k))}${miss?' <span class="tag late">Count differs from DO</span>':''}${o&&o.open>0.5?' '+stTag(o):''}`;}
    case 'recv':return `${esc(cname(e.k))}<div class="small">Received by ${esc(aname(e.acct))}</div>`;
    case 'pay':return `${esc(cname(e.k))}<div class="small">Paid from ${esc(aname(e.acct))}</div>`;
    case 'expense':return `${esc(e.cat||'Other')}<div class="small">Paid from ${esc(aname(e.acct))}</div>`;
    case 'adjust':return (e.lines||[]).map(l=>`${n(l.q)>0?'+':''}${n(l.q)} ${esc(pname(l.p))}`).join(', ');
    case 'transfer':{const fr=e.from||'cash',tt=e.to||(fr==='bank'?'cash':'bank');return `${esc(aname(fr))} to ${esc(aname(tt))}`;}
    case 'capital':return `Into ${esc(aname(e.acct))}`;
    case 'draw':return `Out of ${esc(aname(e.acct))}`;
    case 'opening':return 'Starting position';
    default:return '';
  }
}
function nextNota(){
  let best=null;for(const e of D().entries){if(e.t!=='sale'||!e.nota)continue;const m=String(e.nota).match(/^(\D*)(\d+)(\D*)$/);if(!m)continue;const v=parseInt(m[2],10);if(!best||v>best.v)best={v,m};}
  if(!best)return '';return best.m[1]+String(best.v+1).padStart(best.m[2].length,'0')+best.m[3];
}
function lastSupplier(){const L=D().entries;for(let i=L.length-1;i>=0;i--)if(L[i].t==='purchase'&&L[i].k)return cname(L[i].k);return 'Windpower Jakarta';}

const allReady=()=>S.ready.p&&S.ready.c&&S.ready.d&&S.ready.m;

function banner(){
  const b=[];
  if(S.demo)b.push(`<span>Example data. Nothing entered here is saved.</span><button class="link" data-act="demo-off">${S.mode==='live'?'Back to real records':'Back to sign in'}</button>`);
  else if(S.err)b.push(`<span class="neg">${esc(S.err)}</span>`);

  return `<section class="wrap hero">

    <p class="small" style="max-width:62ch">What the business earned this month after paying for the tires that were sold and the running costs. It is not the same as money in hand, because some notas are not paid yet.</p>
  </section>

        <div class="lrow"><span>Shops owe you<span class="ex">${c.openAR.length} unpaid nota${c.openAR.length===1?'':'s'}${late.length?`, ${late.length} late`:''}.</span></span><a class="v" href="#unpaid">${M(c.arTot)}</a></div>

        <div class="lrow"><span>Tires in the warehouse<span class="ex">What you paid for the tires you still have.</span></span><span class="v">${M(c.stockVal)}</span></div>

/* ---------- unpaid notas and DOs ---------- */
function pageUnpaid(){
  const c=now(),ed=editable();
  const tbl=(list,side)=>{if(!list.length)return `<p class="small" style="padding-block:14px">${side==='ar'?'Every nota is paid.':'Nothing owed to suppliers.'}</p>`;

function totals(d){

async function doSave(){
  const d=S.draft,t=d.t,errEl=$('#formErr');const err=m=>{errEl.textContent=m;};err('');
  if(S.demo)return err('Example mode: entries are not saved. Use "Back to real records" at the top.');
  if(!editable())return err('This page is view only for you.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.d))return err('Pick a date.');
  const T=totals(d);const lines=d.lines.filter(l=>l.p&&(n(l.q)!==0||(t==='purchase'&&n(l.qd))));
  if(d.lines.some(l=>!l.p&&(n(l.q)||n(l.x)||n(l.qd))))return err('One line has a quantity but no tire chosen.');
  const e={id:S.editing?S.editing.id:'e'+uid(),t,d:d.d,ts:S.editing?S.editing.ts:Date.now(),note:(d.note||'').trim()};
  e.by=S.editing&&S.editing.by?S.editing.by:(S.me&&S.me.name)||'';if(S.editing)e.editedBy=(S.me&&S.me.name)||'';
  const needAmt=()=>{if(!(n(d.a)>0)){err('Enter an amount above zero.');return false;}return true;};
  const nota=(d.nota||'').trim();
  if(t==='sale'||t==='purchase'){
    if(t==='sale'&&!nota)return err('Type the nota number from the paper nota.');
    if(nota){const dup=D().entries.find(x=>x.t===t&&x.id!==e.id&&String(x.nota||'').trim().toLowerCase()===nota.toLowerCase());if(dup)return err(`${t==='sale'?'Nota':'DO'} ${nota} is already recorded on ${nice(dup.d)}. Open it from the Journal instead.`);}
    if(!d.k.trim())return err(t==='sale'?'Add the shop\'s name.':'Add the supplier\'s name.');
    if(!lines.length)return err('Add at least one tire.');
    if(lines.some(l=>!n(l.x)))return err(t==='sale'?'Every tire needs a price.':'Every tire needs its cost.');
    if(t==='purchase'&&d.lines.some(l=>l.p&&l.q===''))return err('Type what the warehouse counted for each tire.');
    if(T.paid>T.total+0.5)return err('Paid now is more than the total.');
    if(d.term!=='cash'&&!dueOf(d))return err('Pick the due date.');
  }
  if((t==='recv'||t==='pay')&&!d.k.trim())return err(t==='recv'?'Which shop paid?':'Who did you pay?');
  if(['recv','pay','expense','capital','draw','transfer'].includes(t)&&!needAmt())return;
  if(t==='transfer'&&d.from===d.to)return err('From and To must be different.');
  if(t==='adjust'&&!lines.length)return err('Add at least one tire with a difference.');
  const btn=$('#saveBtn');btn.disabled=true;
  try{
    const kind=t==='sale'||t==='recv'?'customer':'supplier';
    if(['sale','purchase','recv','pay'].includes(t))e.k=await ensureContact(d.k,kind);
    if(t==='sale')Object.assign(e,{nota,lines:lines.map(l=>({p:l.p,q:n(l.q),u:n(l.x)})),disc:n(d.disc),ship:n(d.ship),shipAcct:d.shipAcct||d.acct,term:d.term,due:dueOf(d),paid:T.paid,acct:d.acct});
    if(t==='purchase')Object.assign(e,{nota,lines:lines.map(l=>({p:l.p,qd:l.qd===''?n(l.q):n(l.qd),q:n(l.q),c:n(l.x)})),extra:n(d.extra),term:d.term,due:dueOf(d),paid:T.paid,acct:d.acct});
    if(t==='recv'||t==='pay')Object.assign(e,{a:n(d.a),acct:d.acct,alloc:d.alloc.slice()});
    if(t==='capital'||t==='draw')Object.assign(e,{a:n(d.a),acct:d.acct});
    if(t==='expense')Object.assign(e,{a:n(d.a),acct:d.acct,cat:d.cat});
    if(t==='transfer')Object.assign(e,{a:n(d.a),from:d.from,to:d.to});
    if(t==='adjust')e.lines=lines.map(l=>({p:l.p,q:n(l.q)}));
    if(t==='opening'){
      e.bal={};for(const a of accts())if(n(d.bal[a.id]))e.bal[a.id]=n(d.bal[a.id]);
      e.lines=lines.map(l=>({p:l.p,q:n(l.q),c:n(l.x)}));e.recv=[];e.pay=[];
      for(const r of d.recv)if(r.name.trim()&&n(r.a))e.recv.push({k:await ensureContact(r.name,'customer'),a:n(r.a),nota:(r.nota||'').trim(),due:r.due||d.d});
      for(const r of d.pay)if(r.name.trim()&&n(r.a))e.pay.push({k:await ensureContact(r.name,'supplier'),a:n(r.a),nota:(r.nota||'').trim(),due:r.due||d.d});
    }
    lsSet('tsb-acct',d.acct);
    await saveEntry(e,S.editing?S.editing.d:null);
    toast(S.editing?'Changes saved':TYPES[t]+' saved');
    if(S.editing){S.editing=null;S.draft=null;location.hash='#journal';}
    else{S.draft=newDraft(t,d.d);if(t==='sale')S.draft.nota=nextNotaAfter(nota);drawForm();}
  }catch(x){err(friendly(x));}
  finally{const b=$('#saveBtn');if(b)b.disabled=!editable();}
}

const RNAMES={pl:'Profit',cf:'Money in and out',bs:'What the business owns and owes',st:'Stock value'};
const RSHORT={pl:'Profit',cf:'Money in and out',bs:'Owns and owes',st:'Stock value'};

function statementRows(tab,from,to){
  const c=compute(from,to),P=c.P,C=c.C,R=[];let sum='';
  const h=l=>R.push({k:'headr',l}),it=(l,v,ind,x)=>R.push({k:ind?'ind':'',l,v,x}),tot=(l,v,x)=>R.push({k:'total',l,v,x}),grand=(l,v,x)=>R.push({k:'grand',l,v,x}),note=l=>R.push({k:'note',l});
  const acctRows=()=>{const ks=[...accts().map(a=>a.id),...Object.keys(c.bal).filter(k=>!accts().some(a=>a.id===k))];ks.forEach(k=>{if(accts().some(a=>a.id===k)||Math.round(c.bal[k]||0))it(aname(k),c.bal[k]||0,1);});};
  if(tab==='pl'){

    h('Running costs');const ex=Object.entries(P.exp).sort((a,b)=>b[1]-a[1]);ex.forEach(([k,v])=>it(k,-v,1));if(!ex.length)note('No running costs recorded in this period.');
    tot('Total running costs',-P.expTot,'What it cost to run the business, including ongkir. Accountants call these operating expenses.');

    grand(P.profit>=0?'Profit':'Loss',P.profit,'What the business really earned after everything. Accountants call this net profit.');
    note('Money the owner takes out for personal use is not a business cost, so it is not here. It shows in Money in and out.');
    sum=`The business sold ${P.tires} tires for ${rp(P.net)}. Those tires had cost ${rp(P.cogs)}, so selling them earned ${rp(P.gross)}. Running costs took ${rp(P.expTot)}.${P.adj?` Counting the warehouse changed things by ${rp(P.adj)}.`:''} ${P.profit>=0?`What is left, ${rp(P.profit)}, is the profit.`:`That leaves a loss of ${rp(-P.profit)}.`}`;
  }else if(tab==='cf'){
    const start=c.open.tot;
    tot('Money at the start',start,'All cash and bank when this period began.');
    h('Money that came in');if(C.openIn)it('Opening balances entered',C.openIn,1,'The money you had on day one.');
    it('Paid on the spot when the nota was made',C.saleCash,1);it('Shops paying their notas later',C.arIn,1);it('Owner put money in',C.capIn,1);
    const tin=C.openIn+C.saleCash+C.arIn+C.capIn;tot('Total in',tin);
    const by=Object.entries(c.recvBy).filter(([k,v])=>v);if(by.length){h('Who collected it');by.forEach(([k,v])=>it(aname(k),v,1));}
    h('Money that went out');it('Paid for goods when they arrived',-C.buyCash,1);it('Paying Jakarta and suppliers later',-C.apOut,1);it('Running costs and ongkir',-C.expOut,1);it('Owner took money out',-C.drawOut,1);
    const tout=C.buyCash+C.apOut+C.expOut+C.drawOut;tot('Total out',-tout);
    tot(tin-tout>=0?'More came in than went out':'More went out than came in',tin-tout);
    grand('Money at the end',c.money,'Should match the cash each person holds plus the bank balance.');acctRows();
    note('Profit and money in hand are different. A credit nota counts as profit before the shop pays. Tires in the warehouse were paid for but are not profit until sold.');
    sum=`The business started with ${rp(start)}. ${rp(tin)} came in and ${rp(tout)} went out, so it ended with ${rp(c.money)}.`;
  }else if(tab==='bs'){
    h('What the business owns');acctRows();
    it(`Shops owe you (${c.openAR.length} unpaid notas)`,c.arTot,1,'Notas not paid yet. Accountants call this accounts receivable.');
    it('Tires in the warehouse',c.stockVal,1,'What you paid for the tires you still have. Accountants call this inventory.');tot('Total owned',c.assets,'Accountants call this assets.');
    h('What the business owes');it('You owe Jakarta and suppliers',c.apTot,1,'Goods received, not paid yet. Accountants call this accounts payable.');tot('Total owed',c.apTot,'Accountants call this liabilities.');
    h('What belongs to the owner');it('Value on the starting day',c.eqOpen,1,'What the business was worth when you started this book.');it('Owner put in',c.cap,1);it('Owner took out',-c.draw,1);
    it('Profit since the start',c.profit,1,'All profit earned since the starting day.');tot('Owner\'s share',c.equity,'What is left for the owner after paying everything owed. Accountants call this equity.');
    grand('Owed plus owner\'s share',c.apTot+c.equity,'This must equal Total owned. When it does, the books balance and nothing is missing.');
    sum=`The business owns ${rp(c.assets)} in money, unpaid notas and tires. It owes ${rp(c.apTot)}. The difference, ${rp(c.equity)}, belongs to the owner.`;
  }else{
    const d=D();let q=0;Object.keys(d.products).sort((a,b)=>pname(a).localeCompare(pname(b))).forEach(id=>{const s=c.st[id];if(!s||(!s.q&&!s.v))return;q+=s.q;R.push({k:'',l:`${pname(id)}: ${s.q} tires at ${rp(s.q?s.v/s.q:0)} each`,v:s.v});});
    if(!R.length)note('No stock on record at this date.');grand('Total warehouse value',c.stockVal,'What you paid for everything in the warehouse.');
    sum=`There ${q===1?'is 1 tire':'are '+q+' tires'} in the warehouse. They cost ${rp(c.stockVal)} to buy.`;
  }
  return {R,c,sum};
}

/* ---------- photos: shrunk in the browser, then stored with the page ---------- */
async function shrink(file){
  let bmp=null;try{bmp=await createImageBitmap(file);}catch(_){return null;}
  const k=Math.min(1,900/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.85));
}
async function setPhoto(pid,file){
  if(!editable())return toast('Sign in to change photos.');
  if(!/^image\//.test(file.type))return toast('That file is not a photo.');
  toast('Uploading photo');
  try{const blob=await shrink(file);if(!blob)return toast('This photo type cannot be read. Use a JPG or PNG.');
    const path=await store.uploadPhoto(blob);const old=S.live.products[pid]&&S.live.products[pid].img;
    await store.patchProduct(pid,{img:path});if(old)store.deletePhoto(old);toast('Photo saved');}
  catch(x){toast('Could not save the photo. '+friendly(x));}
}

  ${v!=='forgot'?F('Password',`<input id="au-pw" type="password" autocomplete="${v==='signup'?'new-password':'current-password'}">`):''}
  <button class="btn primary" type="submit">${v==='signin'?'Sign in':v==='signup'?'Create account':'Send reset email'}</button>${msg}</form>
  <div class="row">${v!=='signin'?'<button class="link" data-act="au-view" data-v="signin">I have an account</button>':''}${v!=='signup'?'<button class="link" data-act="au-view" data-v="signup">Create account</button>':''}${v!=='forgot'?'<button class="link" data-act="au-view" data-v="forgot">Forgot password</button>':''}</div>
  <p class="small">Only emails added by the owner can see the records. ${demo}</p></section>`;
}
function bindAuth(){
  const f=$('#authForm'),p=$('#pwForm');
  if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const email=$('#au-email').value.trim(),pw=$('#au-pw')?$('#au-pw').value:'';S.authMsg='';
    try{
      if(S.authView==='signin'){const {error}=await S.sb.auth.signInWithPassword({email,password:pw});if(error)throw error;return afterLogin();}
      else if(S.authView==='signup'){if(pw.length<8)throw new Error('Use at least 8 characters for the password.');const {error}=await S.sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;S.authMsg='Check your email and press the confirm link, then sign in here.';S.authView='signin';}
      else{const {error}=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;S.authMsg='Reset email sent. Open it on this device.';}
    }catch(x){S.authMsg=/Invalid login/i.test(x.message)?'Wrong email or password.':/not confirmed/i.test(x.message)?'Confirm your email first. Check your inbox.':x.message;}
    render();});
  if(p)p.addEventListener('submit',async ev=>{ev.preventDefault();const pw=$('#au-pw').value;if(pw.length<8){S.authMsg='Use at least 8 characters.';return render();}
    const {error}=await S.sb.auth.updateUser({password:pw});if(error){S.authMsg=error.message;return render();}S.authMsg='';history.replaceState(null,'',location.pathname);await afterLogin();});
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='au-view'){S.authView=b.dataset.v;S.authMsg='';render();}
  else if(b.dataset.act==='reload'){location.reload();}
  else if(b.dataset.act==='mem-del'){const em=b.dataset.email;if(S.delArm!=='m'+em){S.delArm='m'+em;b.textContent='Tap again to remove';return;}
    S.delArm=null;q(S.sb.from('members').delete().eq('email',em)).then(loadMembers).then(()=>{toast('Access removed');render();}).catch(x=>toast(friendly(x)));}
});
function membersHTML(){
  if(S.demo||!S.me)return '';const owner=S.me.role==='owner';
  const rows=S.live.members.map(m=>`<div class="lrow"><span>${esc(m.name||'')}<span class="ex">${esc(m.email)}${m.role==='owner'?' (owner)':''}</span></span>${owner&&m.email!==S.me.email?`<button class="link danger" data-act="mem-del" data-email="${esc(m.email)}">Remove</button>`:''}</div>`).join('');
  return `<div class="stack" style="margin-top:12px;gap:6px"><p class="micro">Who can use this book</p>${rows}
  ${owner?`<form id="memForm" class="grid2" novalidate style="margin-top:8px">${F('Email','<input id="mf-email" type="email" inputmode="email" placeholder="name@gmail.com">')}${F('Name shown on entries','<input id="mf-name" placeholder="Ci Bella">')}${F('Can manage this list','<select id="mf-role"><option value="staff">No</option><option value="owner">Yes</option></select>')}<div style="align-self:end"><button class="btn" type="submit">Give access</button></div></form>`:'<p class="small">Only an owner can add or remove people.</p>'}</div>`;
}
async function loadMembers(){S.live.members=await q(S.sb.from('members').select('*').order('added_at'));}

/* ---------- loading records ---------- */
async function fetchAll(table){let out=[],from=0;for(;;){const rows=await q(S.sb.from(table).select('id,data').range(from,from+999));out=out.concat(rows);if(rows.length<1000)break;from+=1000;}return out;}
async function loadTable(t){
  const rows=await fetchAll(t);
  if(t==='entries')S.live.entries=rows.map(r=>r.data);
  else if(t==='settings'){const r=rows.find(x=>x.id==='setup');S.live.setup=r?r.data:{};}
  else{const o={};rows.forEach(r=>{o[r.id]=r.data;});S.live[t]=o;}
  S.ready[{products:'p',contacts:'c',entries:'d',settings:'m'}[t]]=1;S.ver++;S.cache={};schedule();
}
const reloadSoon={};
function watch(){
  const ch=S.sb.channel('books');
  ['products','contacts','entries','settings'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(reloadSoon[t]);reloadSoon[t]=setTimeout(()=>loadTable(t).catch(()=>{}),300);}));
  ch.subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.mode==='live')['products','contacts','entries','settings'].forEach(t=>loadTable(t).catch(()=>{}));});
}
async function afterLogin(){
  const {data:{user}}=await S.sb.auth.getUser();if(!user){S.mode='login';return render();}
  const email=(user.email||'').toLowerCase();
  let mem=null;try{mem=(await q(S.sb.from('members').select('*').eq('email',email)))[0];}catch(_){}
  if(!mem){S.me={email};S.mode='denied';return render();}
  S.me={id:user.id,email,name:mem.name||email.split('@')[0],role:mem.role};S.mode='live';S.assets=true;S.canWrite=true;render();
  setTimeout(()=>{if(!allReady()){S.slow=true;schedule();}},10000);
  try{await Promise.all(['products','contacts','entries','settings'].map(loadTable));await loadMembers();S.slow=false;schedule();}
  catch(x){S.err='Saved records could not be loaded. '+friendly(x);schedule();}
  watch();
}

/* ---------- boot ---------- */
async function boot(){
  const cfg=window.BOOKS_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||/YOUR-/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)){S.mode='noconfig';return render();}
  S.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true}});
  const recovering=/type=recovery/.test(location.hash);
  S.sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){S.mode='recovery';render();}});
  const {data:{session}}=await S.sb.auth.getSession();
  if(recovering&&session){S.mode='recovery';return render();}
  if(/access_token|type=signup/.test(location.hash))history.replaceState(null,'',location.pathname);
  if(!session){S.mode='login';return render();}
  await afterLogin();
}
boot();
})();
</script>
</body>
</html>
